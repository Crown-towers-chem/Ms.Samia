acity:0; } }\n\n        @media (max-width: 700px) {\n            body { padding: 10px; }\n            .container { padding: 20px 12px; border-radius: 18px; border-width: 5px; }\n            h1 { font-size: 1.5em; }\n            h3 { font-size: 1.15em; padding: 10px; }\n            .speech-controls { padding: 10px; gap: 10px; }\n            .control-group { font-size: 0.9em; }\n            .play-btn { padding: 10px 18px; font-size: 1em; width: 100%; margin: 6px 0; }\n            .note-box { flex-direction: column; align-items: flex-end; gap: 4px; }\n            .sec-head .t { font-size: 1.5em; }\n            .cards { gap: 6px; }\n            .card { flex-direction: column; text-align: center; gap: 2px; padding: 8px 4px; }\n            .card .em { font-size: 1.7em; }\n            .card .en { font-size: 1em; }\n            .card .ar { font-size: .78em; text-align: center; }\n            .floating-stop-btn { width: 52px; height: 52px; font-size: 1.3em; bottom: 15px; right: 15px; }\n        }\n    <\/style>\n<\/head>\n<body>\n<div style=\"position:sticky; top:0; background-color:#ffffff; padding:15px 0; text-align:center; font-family:Arial, sans-serif; box-shadow:0 4px 6px rgba(0,0,0,0.1); z-index:1000; display:flex; flex-direction:column; align-items:center;\">\n  <h3 style=\"margin:2px 0; color:#333; text-align:center;\">Ms. Engy Taha (Ms. Samia)<\/h3>\n  <div style=\"margin-top:8px;\">\n    <a href=\"tel:+201150231594\" style=\"display:inline-block; background-color:#007BFF; color:#fff; padding:8px 16px; margin:3px; border-radius:5px; text-decoration:none; font-weight:bold;\">\n      📞 01150231594\n    <\/a>\n    <a href=\"https://wa.me/+201150231594\" target=\"_blank\" style=\"display:inline-block; background-color:#25D366; color:#fff; padding:8px 16px; margin:3px; border-radius:5px; text-decoration:none; font-weight:bold;\">\n      💬 تواصل عبر الواتس\n    <\/a>\n  <\/div>\n<\/div>\n\n<div class=\"container\">\n    <h1 id=\"main-title\">📚 Loading...<\/h1>\n    <h2 id=\"sub-title\"><\/h2>\n\n    <div class=\"speech-controls\">\n        <div class=\"control-group\"><label>🗣️ اللكنة:<\/label>\n            <select id=\"voice-select\"><option value=\"en-US\">American (US) 🇺🇸<\/option><option value=\"en-GB\">British (UK) 🇬🇧<\/option><\/select>\n        <\/div>\n        <div class=\"control-group\"><label>⚡ السرعة:<\/label>\n            <input type=\"range\" id=\"speed-slider\" min=\"0.5\" max=\"1.2\" value=\"0.9\" step=\"0.1\">\n            <span id=\"speed-value\">0.9x<\/span>\n        <\/div>\n        <div class=\"theme-switcher\">\n            <label>🎨<\/label>\n            <span class=\"theme-dot active\" data-theme=\"book\"><\/span>\n            <span class=\"theme-dot\" data-theme=\"green\" style=\"background:#2e7d32;\"><\/span>\n            <span class=\"theme-dot\" data-theme=\"blue\" style=\"background:#1565c0;\"><\/span>\n            <span class=\"theme-dot\" data-theme=\"orange\" style=\"background:#ef6c00;\"><\/span>\n            <span class=\"theme-dot\" data-theme=\"pink\" style=\"background:#d81b60;\"><\/span>\n        <\/div>\n    <\/div>\n\n    <div id=\"top-actions\"><\/div>\n    <div id=\"content\"><\/div>\n\n    <h3 id=\"quiz-title\">📝 Quick Quiz (اختبار سريع)<\/h3>\n    <div id=\"quiz-progress\"><\/div>\n    <div id=\"quiz-container\"><\/div>\n    <div id=\"quiz-feedback\" class=\"quiz-feedback\"><\/div>\n    <div id=\"quiz-score\" class=\"quiz-score\"><\/div>\n    <button id=\"quiz-reset-btn\" class=\"play-btn\" style=\"display:none;\">🔄 إعادة الاختبار<\/button>\n<\/div>\n\n<button id=\"stop-btn\" class=\"floating-stop-btn\" title=\"إيقاف النطق\">⏹️<\/button>\n\n<script>\n    // ============================================================\n    // Lesson data (transcribed from: Level 2 - Step by Step Master Booklet)\n    // ============================================================\n    const lessonData = {\"type\": \"cards\", \"meta\": {\"mainTitle\": \"🔚 Level 2 - Word Endings: tion · sion · ture · sure · cia\", \"subTitle\": \"Phonics Master Series - Level 2: Step by Step with Miss Engy Taha\", \"color\": \"#00897b\"}, \"sections\": [{\"tab\": \"tion\", \"title\": \"tion\", \"sub\": \"tion = شن\", \"color\": \"#5e35b1\", \"blocks\": [{\"cols\": 3, \"cards\": [{\"en\": \"question\", \"em\": \"❓\", \"ar\": \"سؤال\"}, {\"en\": \"Nation\", \"em\": \"🌍\", \"ar\": \"دولة\"}, {\"en\": \"station\", \"em\": \"🚉\", \"ar\": \"محطة\"}, {\"en\": \"bus station\", \"em\": \"🚌\", \"ar\": \"محطة أتوبيس\"}, {\"en\": \"Train station\", \"em\": \"🚆\", \"ar\": \"محطة قطار\"}, {\"en\": \"Education\", \"em\": \"🎓\", \"ar\": \"التعليم\"}, {\"en\": \"action\", \"em\": \"🎬\", \"ar\": \"حدث / تصرف / فعل\"}, {\"en\": \"Reaction\", \"em\": \"🔁\", \"ar\": \"رد فعل\"}, {\"en\": \"Motion\", \"em\": \"🏃\", \"ar\": \"حركة\"}, {\"en\": \"Fiction\", \"em\": \"🧚\", \"ar\": \"خيال\"}, {\"en\": \"information\", \"em\": \"ℹ️\", \"ar\": \"معلومات\"}, {\"en\": \"Pollution\", \"em\": \"🏭\", \"ar\": \"تلوث\"}, {\"en\": \"Solution\", \"em\": \"🔑\", \"ar\": \"حل\"}]}]}, {\"tab\": \"sion (جن)\", \"title\": \"sion\", \"sub\": \"sion = جن (إذا جاء قبلها حرف متحرك a-e-i-o-u)\", \"color\": \"#e53935\", \"blocks\": [{\"cols\": 3, \"cards\": [{\"en\": \"Vision\", \"em\": \"👁️\", \"ar\": \"رؤية\"}, {\"en\": \"Revision\", \"em\": \"🔎\", \"ar\": \"مراجعة\"}, {\"en\": \"TeleVision\", \"em\": \"📺\", \"ar\": \"تلفاز\"}, {\"en\": \"Division\", \"em\": \"➗\", \"ar\": \"قسمة\"}, {\"en\": \"decision\", \"em\": \"🔀\", \"ar\": \"قرار\"}, {\"en\": \"Confusion\", \"em\": \"😵\", \"ar\": \"تشويش\"}, {\"en\": \"Explosion\", \"em\": \"💥\", \"ar\": \"انفجار\"}, {\"en\": \"SuperVision\", \"em\": \"🧐\", \"ar\": \"مراقبة\"}, {\"en\": \"Delusion\", \"em\": \"🌀\", \"ar\": \"وهم\"}]}]}, {\"tab\": \"sion (شن)\", \"title\": \"sion\", \"sub\": \"sion = شن (إذا جاء قبلها حرف ساكن)\", \"color\": \"#1e88e5\", \"blocks\": [{\"cols\": 3, \"cards\": [{\"en\": \"Tension\", \"em\": \"😬\", \"ar\": \"توتر\"}, {\"en\": \"expansion\", \"em\": \"↔️\", \"ar\": \"توسع\"}, {\"en\": \"expression\", \"em\": \"😀\", \"ar\": \"تعبير\"}, {\"en\": \"session\", \"em\": \"🗓️\", \"ar\": \"جلسة\"}, {\"en\": \"Mission\", \"em\": \"🎯\", \"ar\": \"مهمة\"}, {\"en\": \"Passion\", \"em\": \"💖\", \"ar\": \"عاطفة / شغف\"}, {\"en\": \"extension\", \"em\": \"📏\", \"ar\": \"تمديد\"}, {\"en\": \"discussion\", \"em\": \"🗣️\", \"ar\": \"مناقشة\"}, {\"en\": \"Pension\", \"em\": \"👵\", \"ar\": \"معاش\"}]}]}, {\"tab\": \"ture / su\", \"title\": \"ture / su\", \"sub\": \"ture = تشر\", \"color\": \"#43a047\", \"blocks\": [{\"cols\": 3, \"info\": [{\"b\": \"ملحوظة\", \"t\": \"(su) في بداية الكلمة تُنطق (ش) — sure = شُر\"}], \"cards\": [{\"en\": \"Picture\", \"em\": \"🖼️\", \"ar\": \"صورة\"}, {\"en\": \"Nature\", \"em\": \"🌿\", \"ar\": \"الطبيعة\"}, {\"en\": \"Future\", \"em\": \"🔮\", \"ar\": \"المستقبل\"}, {\"en\": \"structure\", \"em\": \"🏗️\", \"ar\": \"قاعدة / بناء\"}, {\"en\": \"Culture\", \"em\": \"🏺\", \"ar\": \"الثقافة\"}, {\"en\": \"lecture\", \"em\": \"🎤\", \"ar\": \"محاضرة\"}, {\"en\": \"Furniture\", \"em\": \"🛋️\", \"ar\": \"أثاث\"}, {\"en\": \"feature\", \"em\": \"⭐\", \"ar\": \"ميزة\"}, {\"en\": \"sure\", \"em\": \"👍\", \"ar\": \"بالتأكيد\"}, {\"en\": \"sugar\", \"em\": \"🍬\", \"ar\": \"السكر\"}, {\"en\": \"ensure\", \"em\": \"🛡️\", \"ar\": \"يضمن\"}, {\"en\": \"Issue\", \"em\": \"⚠️\", \"ar\": \"مشكلة\"}]}]}, {\"tab\": \"sure (جر)\", \"title\": \"sure\", \"sub\": \"sure = جر (إذا جاء قبلها حرف متحرك)\", \"color\": \"#fb8c00\", \"blocks\": [{\"cols\": 3, \"cards\": [{\"en\": \"Pleasure\", \"em\": \"😊\", \"ar\": \"سعادة\"}, {\"en\": \"Treasure\", \"em\": \"💎\", \"ar\": \"كنز\"}, {\"en\": \"Displeasure\", \"em\": \"😠\", \"ar\": \"استياء\"}, {\"en\": \"Measure\", \"em\": \"📐\", \"ar\": \"إجراء / مقياس\"}, {\"en\": \"Exposure\", \"em\": \"🔆\", \"ar\": \"انكشاف / إظهار\"}, {\"en\": \"Discomposure\", \"em\": \"😰\", \"ar\": \"قلق / اضطراب\"}, {\"en\": \"Enclosure\", \"em\": \"🚧\", \"ar\": \"سور / إحاطة\"}, {\"en\": \"Leisure\", \"em\": \"🏖️\", \"ar\": \"راحة / فراغ\"}, {\"en\": \"Countermeasure\", \"em\": \"🔙\", \"ar\": \"إجراء انتقامي / ضد\"}, {\"en\": \"Embrasure\", \"em\": \"🧱\", \"ar\": \"فتحة في جدار\"}]}]}, {\"tab\": \"sure (شر)\", \"title\": \"sure\", \"sub\": \"sure = شر (إذا جاء قبلها حرف ساكن)\", \"color\": \"#8e24aa\", \"blocks\": [{\"cols\": 3, \"cards\": [{\"en\": \"Pressure\", \"em\": \"🗜️\", \"ar\": \"الضغط\"}, {\"en\": \"Fissure\", \"em\": \"💔\", \"ar\": \"شق / ثغرة\"}, {\"en\": \"Censure\", \"em\": \"🙅\", \"ar\": \"لوم / إدانة\"}, {\"en\": \"Acupressure\", \"em\": \"💆\", \"ar\": \"العلاج بالضغط على مناطق في الجسم\"}, {\"en\": \"Licensure\", \"em\": \"📜\", \"ar\": \"ترخيص\"}, {\"en\": \"sure\", \"em\": \"👍\", \"ar\": \"بالتأكيد\"}, {\"en\": \"sugar\", \"em\": \"🍬\", \"ar\": \"السكر\"}]}]}, {\"tab\": \"cia · cio · cie\", \"title\": \"cia · cio · cie\", \"sub\": \"cia / cio / cie = ش\", \"color\": \"#00897b\", \"blocks\": [{\"cols\": 3, \"cards\": [{\"en\": \"official\", \"em\": \"🏛️\", \"ar\": \"رسمي\"}, {\"en\": \"Special\", \"em\": \"🌟\", \"ar\": \"خاص\"}, {\"en\": \"Social\", \"em\": \"👥\", \"ar\": \"اجتماعي\"}, {\"en\": \"Social media\", \"em\": \"📲\", \"ar\": \"وسائل التواصل الاجتماعي\"}, {\"en\": \"Musician\", \"em\": \"🎹\", \"ar\": \"موسيقار\"}, {\"en\": \"Magician\", \"em\": \"🎩\", \"ar\": \"ساحر\"}, {\"en\": \"Ancient\", \"em\": \"🗿\", \"ar\": \"قديم\"}, {\"en\": \"Efficient\", \"em\": \"⚙️\", \"ar\": \"كافٍ / كفء\"}, {\"en\": \"Precious\", \"em\": \"💎\", \"ar\": \"ثمين\"}, {\"en\": \"delicious\", \"em\": \"😋\", \"ar\": \"لذيذ\"}]}]}]};\n\n    // ============================================================\n    // Engine (same engine as the Level 1 lessons)\n    // ============================================================\n    const $ = (id) => document.getElementById(id);\n    const synth = window.speechSynthesis || { speak(){}, cancel(){}, getVoices(){ return []; } };\n    let availableVoices = [];\n    let voiceLoadAttempt = 0;\n    const MAX_VOICE_ATTEMPTS = 6;\n    const RETRY_DELAYS = [0, 150, 400, 800, 1500, 2500];\n\n    function lsGet(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }\n    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }\n\n    function loadAvailableVoices() {\n        const vList = synth.getVoices();\n        if (vList.length) {\n            availableVoices = vList;\n            voiceLoadAttempt = 0;\n            populateVoiceDropdown();\n            return;\n        }\n        if (voiceLoadAttempt < MAX_VOICE_ATTEMPTS) {\n            const delay = RETRY_DELAYS[voiceLoadAttempt] || 2500;\n            voiceLoadAttempt++;\n            setTimeout(loadAvailableVoices, delay);\n        }\n    }\n    function voiceQualityScore(v) {\n        const name = (v.name || '').toLowerCase();\n        let score = 0;\n        if (name.includes('google')) score += 30;\n        if (name.includes('microsoft')) score += 25;\n        if (name.includes('samantha')) score += 20;\n        if (v.localService) score += 2;\n        return score;\n    }\n    function populateVoiceDropdown() {\n        const vs = $('voice-select');\n        if (!vs || !availableVoices.length) return;\n        const normLang = (l) => String(l||'').replace('_','-').toLowerCase();\n        const enVoices = availableVoices.filter(v => {\n            const lang = normLang(v.lang);\n            return lang.startsWith('en-us') || lang.startsWith('en-gb');\n        });\n        if (!enVoices.length) return;\n        enVoices.sort((a,b) => voiceQualityScore(b) - voiceQualityScore(a));\n        const savedLang = lsGet('lesson_voice', 'en-US');\n        const savedVoiceURI = lsGet('lesson_voiceURI', '');\n        vs.innerHTML = '';\n        enVoices.forEach(v => {\n            const lang = String(v.lang||'').replace('_','-');\n            const isUS = lang.toLowerCase().startsWith('en-us');\n            const flag = isUS ? '🇺🇸 American' : '🇬🇧 British';\n            const opt = document.createElement('option');\n            opt.value = v.voiceURI;\n            opt.dataset.lang = lang;\n            opt.textContent = flag + ' — ' + v.name;\n            vs.appendChild(opt);\n        });\n        const savedOpt = [...vs.options].find(o => o.value === savedVoiceURI) ||\n                         [...vs.options].find(o => o.dataset.lang.toLowerCase().startsWith(savedLang.toLowerCase()));\n        if (savedOpt) vs.value = savedOpt.value;\n    }\n    function getBestVoice() {\n        const vs = $('voice-select');\n        if (!vs) return null;\n        const found = availableVoices.find(v => v.voiceURI === vs.value);\n        if (found) return found;\n        const targetLang = vs.options[vs.selectedIndex]?.dataset?.lang || vs.value || 'en-US';\n        const normTarget = targetLang.toLowerCase().replace('_','-');\n        const matches = availableVoices.filter(v => {\n            const vl = String(v.lang||'').replace('_','-').toLowerCase();\n            return vl === normTarget || vl.startsWith(normTarget + '-') || vl.startsWith(normTarget.split('-')[0] + '-' + normTarget.split('-')[1]);\n        });\n        if (matches.length) {\n            matches.sort((a,b) => voiceQualityScore(b) - voiceQualityScore(a));\n            return matches[0];\n        }\n        return null;\n    }\n    function getSelectedLang() {\n        const vs = $('voice-select');\n        if (!vs) return 'en-US';\n        const opt = vs.options[vs.selectedIndex];\n        return (opt && opt.dataset && opt.dataset.lang) || vs.value || 'en-US';\n    }\n    loadAvailableVoices();\n    if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadAvailableVoices;\n\n    let speechQueue = [];\n    let isPlaying = false;\n    let currentSpeakingElement = null;\n\n    // ---------- theme (default = the colour used in the book for this lesson) ----------\n    const BASE = lessonData.meta.color;\n    function hex2rgb(h) { h = h.replace('#',''); return [0,2,4].map(i => parseInt(h.substr(i,2),16)); }\n    function rgb2hex(r) { return '#' + r.map(v => Math.round(v).toString(16).padStart(2,'0')).join(''); }\n    function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex(A.map((v,i) => v*(1-t) + B[i]*t)); }\n    const themeColors = { book: BASE, green:'#2e7d32', blue:'#1565c0', orange:'#ef6c00', pink:'#d81b60' };\n    function applyTheme(t) {\n        const base = themeColors[t] || BASE;\n        const root = document.documentElement.style;\n        root.setProperty('--accent-color', base);\n        root.setProperty('--highlight-color', mix(base, '#ffffff', 0.8));\n        root.setProperty('--speak-highlight', mix(base, '#000000', 0.35));\n        root.setProperty('--play-all-btn', base);\n        root.setProperty('--play-shadow', mix(base, '#000000', 0.3));\n        root.setProperty('--border-color', mix(base, '#ffffff', 0.45));\n        root.setProperty('--soft-bg', mix(base, '#ffffff', 0.9));\n    }\n    function loadPrefs() {\n        const speed = lsGet('lesson_speed', '0.9');\n        const theme = lsGet('lesson2_theme', 'book');\n        $('speed-slider').value = speed;\n        $('speed-value').innerText = speed + 'x';\n        applyTheme(theme);\n        document.querySelectorAll('.theme-dot').forEach(d => {\n            if (d.dataset.theme === 'book') d.style.background = BASE;\n            d.classList.toggle('active', d.dataset.theme === theme);\n        });\n    }\n    function savePrefs() {\n        lsSet('lesson_voice', getSelectedLang());\n        lsSet('lesson_voiceURI', $('voice-select').value);\n        lsSet('lesson_speed', $('speed-slider').value);\n        lsSet('lesson2_theme', document.querySelector('.theme-dot.active')?.dataset?.theme || 'book');\n    }\n\n    // ---------- speech ----------\n    function clearHighlight() {\n        if (currentSpeakingElement) {\n            currentSpeakingElement.classList.remove('speaking-highlight');\n            currentSpeakingElement = null;\n        }\n    }\n    function cancelSpeech() {\n        synth.cancel();\n        isPlaying = false;\n        speechQueue = [];\n        clearHighlight();\n    }\n    function makeUtter(text) {\n        const utter = new SpeechSynthesisUtterance(text);\n        utter.lang = getSelectedLang();\n        const v = getBestVoice(); if (v) utter.voice = v;\n        utter.rate = parseFloat($('speed-slider').value);\n        return utter;\n    }\n    function speakText(text, element) {\n        if (!text) return;\n        cancelSpeech();\n        const utter = makeUtter(text);\n        if (element) {\n            element.classList.add('speaking-highlight');\n            currentSpeakingElement = element;\n            element.scrollIntoView({ behavior: 'smooth', block: 'center' });\n            utter.onend = utter.onerror = () => { clearHighlight(); isPlaying = false; };\n        }\n        synth.speak(utter);\n        isPlaying = true;\n    }\n    function playQueue(elements) {\n        cancelSpeech();\n        if (!elements || elements.length === 0) return;\n        let index = 0;\n        speechQueue = [...elements];\n        isPlaying = true;\n        function next() {\n            if (!isPlaying || index >= speechQueue.length) { isPlaying = false; clearHighlight(); return; }\n            const el = speechQueue[index];\n            const text = (el.dataset.say || el.innerText).trim();\n            if (!text) { index++; next(); return; }\n            const utter = makeUtter(text);\n            el.classList.add('speaking-highlight');\n            currentSpeakingElement = el;\n            el.scrollIntoView({ behavior: 'smooth', block: 'center' });\n            const done = () => { clearHighlight(); index++; if (isPlaying) next(); else isPlaying = false; };\n            utter.onend = done;\n            utter.onerror = done;\n            synth.speak(utter);\n        }\n        next();\n    }\n\n    // ============================================================\n    // Type 1: comparison tables (Letter Group + 4 columns, as in the book)\n    // ============================================================\n    function makeWp(item, cls) {\n        const wp = document.createElement('span');\n        wp.className = 'wp ' + cls;\n        wp.dataset.say = item.en;\n        const w = document.createElement('span'); w.className = 'w'; w.textContent = item.en;\n        wp.appendChild(w);\n        if (item.note) {\n            const n = document.createElement('span'); n.className = 'note'; n.textContent = '*(' + item.note + ')*';\n            wp.appendChild(n);\n        }\n        const e = document.createElement('span'); e.className = 'e'; e.textContent = item.em;\n        wp.appendChild(e);\n        wp.onclick = () => speakText(item.en, wp);\n        return wp;\n    }\n\n    function renderCompare() {\n        const d = lessonData, root = $('content');\n        const allEls = [], shortEls = [], longEls = [];\n        const L = d.meta.letter;\n\n        d.parts.forEach((part, pi) => {\n            const h3 = document.createElement('h3');\n            h3.textContent = '🔤 ' + (pi === 0 ? 'I' : 'II') + '. Comparison Table - ' + part.title + ' (' + part.ar + ')';\n            root.appendChild(h3);\n\n            const nb = document.createElement('div');\n            nb.className = 'note-box';\n            nb.innerHTML = '<span class=\"dirtag\">Left → Right<\/span><span class=\"nt\">' + part.note + '<\/span>';\n            root.appendChild(nb);\n\n            const wrap = document.createElement('div'); wrap.className = 'table-wrap';\n            const table = document.createElement('table'); table.className = 'cmp';\n            const colEls = d.colLabels.map(() => []);\n\n            // header: Letter Group + 4 pattern columns\n            const thead = document.createElement('thead');\n            const hr = document.createElement('tr');\n            const th0 = document.createElement('th'); th0.className = 'gh'; th0.textContent = 'Letter Group';\n            hr.appendChild(th0);\n            d.colLabels.forEach((lab, ci) => {\n                const th = document.createElement('th');\n                th.className = 'colh';\n                th.style.background = d.colColors[ci];\n                th.textContent = lab + ' 🔊';\n                th.title = 'اضغط لسماع كل كلمات العمود';\n                th.onclick = () => playQueue(colEls[ci]);\n                hr.appendChild(th);\n            });\n            thead.appendChild(hr);\n            table.appendChild(thead);\n\n            const tbody = document.createElement('tbody');\n            part.rows.forEach(r => {\n                const tr = document.createElement('tr');\n                const rowEls = [];\n                const tg = document.createElement('td'); tg.className = 'grp'; tg.textContent = r.g;\n                tg.title = 'اضغط لسماع الصف كاملاً';\n                tg.onclick = () => playQueue(rowEls);\n                tr.appendChild(tg);\n                r.cells.forEach((items, ci) => {\n                    const td = document.createElement('td');\n                    const line = document.createElement('div');\n                    items.forEach(it => {\n                        const wp = makeWp(it, ci === 0 ? 'c0' : 'cl');\n                        line.appendChild(wp);\n                        rowEls.push(wp); colEls[ci].push(wp); allEls.push(wp);\n                        (ci === 0 ? shortEls : longEls).push(wp);\n                    });\n                    td.appendChild(line);\n                    const m = document.createElement('div'); m.className = 'mean';\n                    m.textContent = '(' + items.map(i => i.ar).join(' / ') + ')';\n                    td.appendChild(m);\n                    tr.appendChild(td);\n                });\n                tbody.appendChild(tr);\n            });\n            table.appendChild(tbody);\n            wrap.appendChild(table);\n            root.appendChild(wrap);\n\n            const rb = document.createElement('div'); rb.className = 'rules';\n            rb.innerHTML = '<div class=\"rt\">' + part.rules[0] + '<\/div><ul>' +\n                part.rules[1].map(x => '<li>' + x + '<\/li>').join('') + '<\/ul>';\n            root.appendChild(rb);\n        });\n\n        const act = $('top-actions');\n        [['▶️ نطق الجدول كاملاً', allEls], ['▶️ نطق Short ' + L + ' فقط', shortEls], ['▶️ نطق Long ' + L + ' فقط', longEls]]\n            .forEach(([label, els]) => {\n                const b = document.createElement('button');\n                b.className = 'play-btn'; b.textContent = label;\n                b.onclick = () => playQueue(els);\n                act.appendChild(b);\n            });\n    }\n\n    // ============================================================\n    // Type 2: tabs + cards (3 columns, a few pages have 2 - as in the book)\n    // ============================================================\n    function tint(hex) { return mix(hex, '#ffffff', 0.9); }\n\n    function hlNode(word, pat) {\n        const frag = document.createDocumentFragment();\n        if (!pat) { frag.appendChild(document.createTextNode(word)); return frag; }\n        const low = word.toLowerCase();\n        let i = low.indexOf(pat);\n        if (i < 0) { frag.appendChild(document.createTextNode(word)); return frag; }\n        let len = pat.length;\n        if (len === 1) { while (low[i + len] === pat) len++; }\n        frag.appendChild(document.createTextNode(word.slice(0, i)));\n        const s = document.createElement('span'); s.className = 'hl'; s.textContent = word.slice(i, i + len);\n        frag.appendChild(s);\n        frag.appendChild(document.createTextNode(word.slice(i + len)));\n        return frag;\n    }\n\n    function renderCards() {\n        const d = lessonData, root = $('content');\n        const tabs = document.createElement('div'); tabs.className = 'tabs'; root.appendChild(tabs);\n        const holder = document.createElement('div'); root.appendChild(holder);\n        const secEls = [], tabEls = [];\n\n        d.sections.forEach((s, si) => {\n            const tab = document.createElement('button');\n            tab.className = 'tab'; tab.style.setProperty('--tc', s.color); tab.textContent = s.tab;\n            tab.onclick = () => { showSection(si); tabs.scrollIntoView({ behavior: 'smooth', block: 'start' }); };\n            tabs.appendChild(tab); tabEls.push(tab);\n\n            const sec = document.createElement('div');\n            sec.className = 'sec';\n            sec.style.setProperty('--sc', s.color);\n            sec.style.setProperty('--sc-bg', tint(s.color));\n            const secCards = [];\n\n            const head = document.createElement('div'); head.className = 'sec-head';\n            const hl = document.createElement('div');\n            hl.innerHTML = '<div class=\"t\"><\/div><div class=\"s\"><\/div>';\n            hl.querySelector('.t').textContent = s.title;\n            hl.querySelector('.s').textContent = s.sub;\n            head.appendChild(hl);\n            const playBtn = document.createElement('button');\n            playBtn.className = 'sec-play'; playBtn.textContent = '▶️ نطق الكلمات';\n            head.appendChild(playBtn);\n            sec.appendChild(head);\n\n            if (s.type === 'table2') {\n                playBtn.style.display = 'none';\n                const t = document.createElement('table'); t.className = 't2';\n                s.rows.forEach(r => {\n                    const tr = document.createElement('tr');\n                    const k = document.createElement('td'); k.className = 'k'; k.textContent = r[0];\n                    const v = document.createElement('td'); v.className = 'v'; v.textContent = r[1];\n                    tr.append(k, v); t.appendChild(tr);\n                });\n                sec.appendChild(t);\n            } else {\n                s.blocks.forEach(b => {\n                    const blk = document.createElement('div');\n                    if (b.color) { blk.style.setProperty('--sc', b.color); blk.style.setProperty('--sc-bg', tint(b.color)); }\n                    if ((b.sounds && b.sounds.length) || (b.info && b.info.length)) {\n                        const ib = document.createElement('div'); ib.className = 'infobox';\n                        if (b.sounds && b.sounds.length) {\n                            const row = document.createElement('div'); row.className = 'irow';\n                            const bd = document.createElement('span'); bd.className = 'badge'; bd.textContent = 'النطق';\n                            const chips = document.createElement('div'); chips.className = 'chips';\n                            b.sounds.forEach(sn => {\n                                const c = document.createElement('span'); c.className = 'snd'; c.dataset.say = sn[2];\n                                c.innerHTML = '<span class=\"en\"><\/span><span>=<\/span><span class=\"ar\"><\/span>';\n                                c.querySelector('.en').textContent = sn[0];\n                                c.querySelector('.ar').textContent = sn[1];\n                                c.onclick = () => speakText(sn[2], c);\n                                chips.appendChild(c);\n                            });\n                            row.append(bd, chips); ib.appendChild(row);\n                        }\n                        (b.info || []).forEach(inf => {\n                            const row = document.createElement('div'); row.className = 'irow';\n                            const bd = document.createElement('span'); bd.className = 'badge'; bd.textContent = inf.b;\n                            const tx = document.createElement('span'); tx.className = 'itx'; tx.textContent = inf.t;\n                            row.append(bd, tx); ib.appendChild(row);\n                        });\n                        blk.appendChild(ib);\n                    }\n                    const grid = document.createElement('div'); grid.className = 'cards';\n                    grid.style.setProperty('--cols', b.cols || 3);\n                    b.cards.forEach(c => {\n                        const el = document.createElement('div'); el.className = 'card'; el.dataset.say = c.en;\n                        const em = document.createElement('div'); em.className = 'em'; em.textContent = c.em;\n                        if (/^[0-9]+(st|nd|rd|th)?$/.test(c.em)) em.classList.add('txt');\n                        const tx = document.createElement('div'); tx.className = 'tx';\n                        const en = document.createElement('div'); en.className = 'en'; en.appendChild(hlNode(c.en, b.hl));\n                        const ar = document.createElement('div'); ar.className = 'ar'; ar.textContent = c.ar;\n                        tx.append(en, ar); el.append(em, tx);\n                        el.onclick = () => speakText(c.en, el);\n                        grid.appendChild(el); secCards.push(el);\n                    });\n                    blk.appendChild(grid);\n                    sec.appendChild(blk);\n                });\n                playBtn.onclick = () => playQueue(secCards);\n            }\n            holder.appendChild(sec); secEls.push(sec);\n        });\n\n        function showSection(i) {\n            cancelSpeech();\n            secEls.forEach((el, j) => el.classList.toggle('active', j === i));\n            tabEls.forEach((el, j) => el.classList.toggle('on', j === i));\n        }\n        showSection(0);\n    }\n\n    // ============================================================\n    // Quiz\n    // ============================================================\n    let quizPool = [], quizItems = [], quizIndex = 0, quizScore = 0;\n\n    function shuffle(arr) {\n        for (let i = arr.length - 1; i > 0; i--) {\n            const j = Math.floor(Math.random() * (i + 1));\n            [arr[i], arr[j]] = [arr[j], arr[i]];\n        }\n        return arr;\n    }\n    function fireConfetti(container) {\n        const colors = ['#e53935', '#fb8c00', '#fdd835', '#43a047', '#1e88e5', '#8e24aa'];\n        for (let i = 0; i < 28; i++) {\n            const conf = document.createElement('div');\n            conf.className = 'confetti-piece';\n            conf.style.left = (35 + Math.random() * 30) + '%';\n            conf.style.background = colors[Math.floor(Math.random() * colors.length)];\n            conf.style.animationDelay = (Math.random() * 0.25) + 's';\n            conf.style.setProperty('--x', (Math.random() * 220 - 110) + 'px');\n            container.appendChild(conf);\n            setTimeout(() => conf.remove(), 1400);\n        }\n    }\n    function collectPool() {\n        const pool = [], seen = new Set();\n        const add = (en, ar, col) => {\n            const k = en.toLowerCase();\n            if (seen.has(k)) return;\n            seen.add(k); pool.push({ en, ar, col });\n        };\n        if (lessonData.type === 'compare') {\n            lessonData.parts.forEach(p => p.rows.forEach(r => r.cells.forEach((items, ci) =>\n                items.forEach(it => add(it.en, it.ar, ci)))));\n        } else {\n            lessonData.sections.forEach(s => {\n                if (s.type === 'table2') return;\n                s.blocks.forEach(b => b.cards.forEach(c => { if (!c.f) add(c.en, c.ar, -1); }));\n            });\n        }\n        return pool;\n    }\n    function buildQuiz() {\n        quizPool = collectPool();\n        quizItems = shuffle([...quizPool]).slice(0, Math.min(10, quizPool.length));\n        quizIndex = 0; quizScore = 0;\n        $('quiz-score').innerText = '';\n        $('quiz-reset-btn').style.display = 'none';\n        showQuizQuestion();\n    }\n    function showQuizQuestion() {\n        const quizBox = $('quiz-container'), progress = $('quiz-progress'),\n              feedback = $('quiz-feedback'), scoreDiv = $('quiz-score');\n        feedback.innerText = ''; feedback.className = 'quiz-feedback';\n        quizBox.innerHTML = '';\n\n        if (quizIndex >= quizItems.length) {\n            progress.innerText = '';\n            scoreDiv.innerText = `🏆 انتهى الاختبار! نتيجتك: ${quizScore} / ${quizItems.length}`;\n            $('quiz-reset-btn').style.display = 'inline-block';\n            return;\n        }\n        progress.innerText = `سؤال ${quizIndex + 1} من ${quizItems.length}`;\n        const item = quizItems[quizIndex];\n        const L = (lessonData.meta.letter || '').toUpperCase();\n        const soundQ = lessonData.type === 'compare' && Math.random() < 0.4;\n\n        const qDiv = document.createElement('div'); qDiv.className = 'quiz-question'; qDiv.style.position = 'relative';\n        const q = document.createElement('p'); q.className = 'q-text';\n        const wordSpan = '<span style=\"color:var(--accent-color); font-family:Roboto,sans-serif; direction:ltr; display:inline-block\">' + item.en + '<\/span>';\n        q.innerHTML = soundQ\n            ? `الكلمة \"${wordSpan}\" — صوت حرف <b>${L}<\/b> فيها:`\n            : `ما معنى كلمة \"${wordSpan}\"؟`;\n        const lb = document.createElement('button'); lb.className = 'listen'; lb.type = 'button'; lb.textContent = '🔊 استمع';\n        lb.onclick = () => speakText(item.en);\n        q.appendChild(lb);\n        qDiv.appendChild(q);\n\n        let options, isCorrect;\n        if (soundQ) {\n            options = [`Short ${L} — صوت قصير`, `Long ${L} — صوت طويل`];\n            const right = item.col === 0 ? options[0] : options[1];\n            isCorrect = (o) => o === right;\n        } else {\n            const seen = new Set([item.ar]); const distractors = [];\n            for (const p of shuffle([...quizPool])) {\n                if (!seen.has(p.ar)) { seen.add(p.ar); distractors.push(p.ar); }\n                if (distractors.length === 3) break;\n            }\n            options = shuffle([item.ar, ...distractors]);\n            isCorrect = (o) => o === item.ar;\n        }\n\n        const optWrap = document.createElement('div'); optWrap.className = 'quiz-options';\n        let locked = false;\n        options.forEach(opt => {\n            const optBtn = document.createElement('div');\n            optBtn.className = 'quiz-option';\n            optBtn.innerText = opt;\n            optBtn.onclick = () => {\n                if (locked) return;\n                locked = true;\n                optWrap.querySelectorAll('.quiz-option').forEach(b => b.style.pointerEvents = 'none');\n                if (isCorrect(opt)) {\n                    optBtn.classList.add('correct');\n                    feedback.innerText = '🎉 إجابة صحيحة!'; feedback.className = 'quiz-feedback correct';\n                    fireConfetti(qDiv);\n                    speakText('Correct!');\n                    quizScore++;\n                    setTimeout(() => { quizIndex++; showQuizQuestion(); }, 1200);\n                } else {\n                    optBtn.classList.add('wrong');\n                    optWrap.querySelectorAll('.quiz-option').forEach(b => { if (isCorrect(b.innerText)) b.classList.add('show-correct'); });\n                    const right = options.find(isCorrect);\n                    feedback.innerText = `❌ خطأ! الإجابة الصحيحة: \"${right}\"`;\n                    feedback.className = 'quiz-feedback wrong';\n                    speakText('Wrong!');\n                    setTimeout(() => { quizIndex++; showQuizQuestion(); }, 2000);\n                }\n            };\n            optWrap.appendChild(optBtn);\n        });\n        qDiv.appendChild(optWrap);\n        quizBox.appendChild(qDiv);\n    }\n\n    // ============================================================\n    // Init\n    // ============================================================\n    function initLesson() {\n        $('main-title').innerText = lessonData.meta.mainTitle;\n        $('sub-title').innerText = lessonData.meta.subTitle;\n        if (lessonData.type === 'compare') renderCompare(); else renderCards();\n        $('stop-btn').onclick = cancelSpeech;\n        buildQuiz();\n        $('quiz-reset-btn').onclick = buildQuiz;\n\n        $('voice-select').onchange = savePrefs;\n        $('speed-slider').oninput = () => {\n            $('speed-value').innerText = $('speed-slider').value + 'x';\n            savePrefs();\n        };\n        document.querySelectorAll('.theme-dot').forEach(dot => {\n            dot.onclick = () => {\n                document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));\n                dot.classList.add('active');\n                applyTheme(dot.dataset.theme);\n                savePrefs();\n            };\n        });\n    }\n    window.onload = () => { loadPrefs(); initLesson(); };\n<\/script>\n<\/body>\n<\/html>\n"}</script>
<script>
    let LESSONS = {};
    try { LESSONS = JSON.parse(document.getElementById('lessons-data').textContent); } catch (e) { console.error(e); }

    function openLesson(key, title) {
        const html = LESSONS[key];
        if (!html) return;
        try { window.speechSynthesis.cancel(); } catch (e) {}
        document.getElementById('viewer-title').textContent = title;
        document.getElementById('frame').srcdoc = html;
        document.getElementById('home').style.display = 'none';
        document.getElementById('viewer').style.display = 'flex';
        history.pushState({ lesson: key }, '');
    }

    function goHome(fromPop) {
        try { window.speechSynthesis.cancel(); } catch (e) {}
        document.getElementById('frame').srcdoc = '';
        document.getElementById('viewer').style.display = 'none';
        document.getElementById('home').style.display = 'block';
        window.scrollTo(0, 0);
        if (fromPop !== true && history.state && history.state.lesson) history.back();
    }

    window.addEventListener('popstate', () => {
        if (document.getElementById('viewer').style.display === 'flex') goHome(true);
    });
</script>
</body>
</html>
