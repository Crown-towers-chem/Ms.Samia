\n\n    <h3 id=\"awords-title\">🍎 IV. Short A Words: A at the Beginning (كلمات تبدأ بـ A)<\/h3>\n    <div class=\"table-wrap\"><table id=\"a-words\"><tbody><\/tbody><\/table><\/div>\n    <div id=\"ex-a\" class=\"examples\"><\/div>\n\n    <h3 id=\"fam-title\">👨‍👩‍👧 V. Short A Word Families - 3 Letters (عائلات الكلمات)<\/h3>\n    <div id=\"families\"><\/div>\n    <div id=\"ex-fam\" class=\"examples\"><\/div>\n\n    <h3 id=\"four-title\">🔠 VI. Short A Words - 4 Letters (كلمات من 4 حروف)<\/h3>\n    <div class=\"table-wrap\"><table id=\"four-words\"><tbody><\/tbody><\/table><\/div>\n    <div id=\"ex-four\" class=\"examples\"><\/div>\n\n    <h3 id=\"story-title\">📖 VII. Sound it. Blend it. Read it! (اقرأ الجمل)<\/h3>\n    <button id=\"play-all-story-btn\" class=\"play-btn\">▶️ نطق الجمل كاملة<\/button>\n    <div id=\"story-container\" style=\"text-align:left; border: 2px solid var(--accent-color); padding: 20px; border-radius: 15px; margin-top:10px;\"><\/div>\n\n    <h3 id=\"quiz-title\">📝 VIII. Quick Quiz (اختبار سريع)<\/h3>\n    <div id=\"quiz-progress\"><\/div>\n    <div id=\"quiz-container\"><\/div>\n    <div id=\"quiz-feedback\" class=\"quiz-feedback\"><\/div>\n    <div id=\"quiz-score\" class=\"quiz-score\"><\/div>\n    <button id=\"quiz-reset-btn\" class=\"play-btn\" style=\"display:none;\">🔄 إعادة الاختبار<\/button>\n<\/div>\n\n<button id=\"stop-btn\" class=\"floating-stop-btn\" title=\"إيقاف النطق\">⏹️<\/button>\n\n<script>\n    // ============================================================\n    // 🟢 Lesson Data: Level 1 - Short Vowels - Short A\n    // ============================================================\n    const lessonData = {\n        meta: {\n            mainTitle: \"🍎 Level 1 - Short Vowels: Short A\",\n            subTitle: \"Phonics is Fun! - Step by Step with Miss Engy Taha\",\n            playAllSounds: \"▶️ نطق الأصوات والدمج\",\n            playAllWords: \"▶️ نطق جميع الكلمات\",\n            playAllStory: \"▶️ نطق الجمل كاملة\"\n        },\n\n        // ===== I. Letters & Vowels =====\n        intro: [\n            {en: \"We have 26 letters.\", ar: \"لدينا 26 حرفًا.\"},\n            {en: \"We have 5 vowels: a, e, i, o, u.\", ar: \"لدينا 5 حروف علة: a, e, i, o, u.\"},\n            {en: \"Short A says a, as in apple.\", ar: \"حرف A القصير ينطق /a/ مثل apple.\"},\n            {en: \"Sound it. Blend it. Read it!\", ar: \"انطقه. ادمجه. اقرأه!\"}\n        ],\n\n        // ===== II. a + consonant =====\n        blends: [\"ab\",\"ac\",\"ad\",\"af\",\"ag\",\"ah\",\"aj\",\"ak\",\"al\",\"am\",\"an\",\"ap\",\"ar\",\"as\",\"at\",\"av\",\"aw\",\"ax\",\"ay\",\"az\"],\n\n        // ===== III. consonant + a =====\n        consA: [\"ba\",\"ca\",\"da\",\"fa\",\"ga\",\"ha\",\"ja\",\"ka\",\"la\",\"ma\",\"na\",\"pa\",\"qa\",\"ra\",\"sa\",\"ta\",\"va\",\"wa\",\"xa\",\"ya\",\"za\"],\n\n        // ===== نطق الأصوات: الشاشة تعرض الحرفين، والصوت يقرأ الكتابة الصوتية =====\n        // (عشان المتصفح ما يقرأهم كحروف منفصلة. عدّلي أي نطق من هنا)\n        say: {\"ab\": \"abb\", \"ac\": \"ack\", \"ad\": \"add\", \"af\": \"aff\", \"ag\": \"agg\", \"ah\": \"ah\", \"aj\": \"adge\", \"ak\": \"ack\", \"al\": \"Al\", \"am\": \"Am\", \"an\": \"Ann\", \"ap\": \"app\", \"ar\": \"arr\", \"at\": \"att\", \"av\": \"Av\", \"aw\": \"aw\", \"ax\": \"ax\", \"ay\": \"ay\", \"az\": \"azz\", \"ba\": \"bah\", \"ca\": \"kah\", \"da\": \"dah\", \"fa\": \"fah\", \"ga\": \"gah\", \"ha\": \"hah\", \"ja\": \"jah\", \"ka\": \"kah\", \"la\": \"lah\", \"ma\": \"mah\", \"na\": \"nah\", \"pa\": \"pah\", \"qa\": \"kwah\", \"ra\": \"rah\", \"sa\": \"sah\", \"ta\": \"tah\", \"va\": \"vah\", \"wa\": \"wah\", \"xa\": \"zah\", \"ya\": \"yah\", \"za\": \"zah\", \"as\": \"as\"},\n\n        // ===== IV. Short A words (A at the beginning) =====\n        aWords: [\n            {en:\"arm\", ar:\"ذراع\"}, {en:\"arc\", ar:\"قوس\"}, {en:\"art\", ar:\"فن / رسم\"}, {en:\"aunt\", ar:\"عمة\"},\n            {en:\"ask\", ar:\"يسأل\"}, {en:\"add\", ar:\"يضيف\"}, {en:\"an\", ar:\"أداة تنكير\"}, {en:\"and\", ar:\"و\"},\n            {en:\"angel\", ar:\"ملاك\"}, {en:\"apron\", ar:\"مريلة\"}, {en:\"alligator\", ar:\"تمساح\"}, {en:\"after\", ar:\"بعد\"},\n            {en:\"apple\", ar:\"تفاحة\"}, {en:\"ant\", ar:\"نملة\"}, {en:\"act\", ar:\"يمثل (يتصرف)\"}, {en:\"axe\", ar:\"فأس\"},\n            {en:\"acorn\", ar:\"ثمرة البلوط\"}, {en:\"all\", ar:\"كل / جميع\"}, {en:\"arrow\", ar:\"سهم\"}, {en:\"animal\", ar:\"حيوان\"},\n            {en:\"airport\", ar:\"المطار\"}, {en:\"apricot\", ar:\"مشمش\"}, {en:\"accident\", ar:\"حادث\"}, {en:\"about\", ar:\"حول / عن\"},\n            {en:\"alarm\", ar:\"منبه\"}, {en:\"album\", ar:\"ألبوم\"}, {en:\"anchor\", ar:\"مرساة\"}, {en:\"apartment\", ar:\"شقة\"},\n            {en:\"adventure\", ar:\"مغامرة\"}, {en:\"accept\", ar:\"يقبل\"}, {en:\"answer\", ar:\"إجابة\"}, {en:\"agree\", ar:\"يوافق\"},\n            {en:\"again\", ar:\"مرة أخرى\"}, {en:\"already\", ar:\"بالفعل\"}, {en:\"allow\", ar:\"يسمح\"}, {en:\"annual\", ar:\"سنوي\"},\n            {en:\"any\", ar:\"أي\"}, {en:\"apart\", ar:\"بعيدًا عن\"}, {en:\"amaze\", ar:\"يدهش\"}, {en:\"arrange\", ar:\"يرتب\"}\n        ],\n\n        // ===== V. Word families (3 letters) =====\n        families: [\n            {name:\"-at\", words:[\n                {en:\"cat\", ar:\"قطة\"}, {en:\"bat\", ar:\"خفاش\"}, {en:\"hat\", ar:\"قبعة\"}, {en:\"mat\", ar:\"سجادة\"},\n                {en:\"rat\", ar:\"فأر\"}, {en:\"sat\", ar:\"جلس\"}, {en:\"fat\", ar:\"سمين\"}, {en:\"pat\", ar:\"يربت\"}]},\n            {name:\"-an\", words:[\n                {en:\"man\", ar:\"رجل\"}, {en:\"fan\", ar:\"مروحة\"}, {en:\"pan\", ar:\"مقلاة\"}, {en:\"can\", ar:\"علبة\"},\n                {en:\"van\", ar:\"شاحنة صغيرة\"}, {en:\"ran\", ar:\"ركض\"}, {en:\"ban\", ar:\"يمنع\"}, {en:\"tan\", ar:\"أسمر\"}]},\n            {name:\"-ag\", words:[\n                {en:\"bag\", ar:\"حقيبة\"}, {en:\"tag\", ar:\"بطاقة\"}, {en:\"rag\", ar:\"خرقة\"}, {en:\"wag\", ar:\"يهز الذيل\"},\n                {en:\"lag\", ar:\"يتأخر\"}, {en:\"nag\", ar:\"يلحّ\"}, {en:\"sag\", ar:\"يهبط\"}]},\n            {name:\"-ad\", words:[\n                {en:\"dad\", ar:\"أبي\"}, {en:\"sad\", ar:\"حزين\"}, {en:\"mad\", ar:\"غاضب\"}, {en:\"bad\", ar:\"سيئ\"},\n                {en:\"pad\", ar:\"مفكرة\"}, {en:\"lad\", ar:\"ولد\"}, {en:\"had\", ar:\"كان لديه\"}]},\n            {name:\"-ap\", words:[\n                {en:\"cap\", ar:\"كاب (قبعة)\"}, {en:\"map\", ar:\"خريطة\"}, {en:\"nap\", ar:\"غفوة\"}, {en:\"tap\", ar:\"صنبور\"},\n                {en:\"lap\", ar:\"حضن\"}, {en:\"gap\", ar:\"فجوة\"}, {en:\"sap\", ar:\"عصارة\"}, {en:\"rap\", ar:\"إيقاع (راب)\"}]},\n            {name:\"-am\", words:[\n                {en:\"ham\", ar:\"لحم مقدد\"}, {en:\"jam\", ar:\"مربى\"}, {en:\"ram\", ar:\"كبش\"}, {en:\"yam\", ar:\"بطاطا حلوة\"},\n                {en:\"dam\", ar:\"سد\"}]},\n            {name:\"-ab\", words:[\n                {en:\"cab\", ar:\"سيارة أجرة\"}, {en:\"dab\", ar:\"لمسة\"}, {en:\"lab\", ar:\"معمل\"}, {en:\"tab\", ar:\"لسان السحب\"}]},\n            {name:\"-ax\", words:[\n                {en:\"wax\", ar:\"شمع\"}, {en:\"tax\", ar:\"ضريبة\"}, {en:\"fax\", ar:\"فاكس\"}]}\n        ],\n\n        // ===== VI. Short A words (4 letters) =====\n        fourWords: [\n            {en:\"hand\", ar:\"يد\"}, {en:\"band\", ar:\"فرقة / شريط\"}, {en:\"land\", ar:\"أرض\"}, {en:\"bank\", ar:\"بنك\"},\n            {en:\"tank\", ar:\"خزان\"}, {en:\"fast\", ar:\"سريع\"}, {en:\"last\", ar:\"الأخير\"}, {en:\"mask\", ar:\"قناع\"},\n            {en:\"task\", ar:\"مهمة\"}, {en:\"lamp\", ar:\"مصباح\"}, {en:\"camp\", ar:\"معسكر\"}, {en:\"park\", ar:\"حديقة\"},\n            {en:\"dark\", ar:\"مظلم\"}, {en:\"bark\", ar:\"ينبح\"}, {en:\"mark\", ar:\"علامة\"}, {en:\"farm\", ar:\"مزرعة\"},\n            {en:\"card\", ar:\"بطاقة\"}, {en:\"yard\", ar:\"فناء\"}, {en:\"cart\", ar:\"عربة\"}, {en:\"hard\", ar:\"صعب\"},\n            {en:\"warm\", ar:\"دافئ\"}, {en:\"smart\", ar:\"ذكي\"}, {en:\"shark\", ar:\"قرش\"}, {en:\"start\", ar:\"يبدأ\"},\n            {en:\"part\", ar:\"جزء\"}, {en:\"dart\", ar:\"سهم صغير\"}, {en:\"bald\", ar:\"أصلع\"}, {en:\"salt\", ar:\"ملح\"},\n            {en:\"calf\", ar:\"عجل صغير\"}, {en:\"palm\", ar:\"نخلة\"}\n        ],\n\n        // ===== أمثلة الجمل بعد كل قسم =====\n        examples: {\n        aWords: [\n            {en:\"I have an apple.\", ar:\"لدي تفاحة.\", w:[\"apple\"]},\n            {en:\"The ant is on my arm.\", ar:\"النملة على ذراعي.\", w:[\"ant\", \"arm\"]},\n            {en:\"My aunt likes art.\", ar:\"عمتي تحب الفن.\", w:[\"aunt\", \"art\"]},\n            {en:\"The alligator is in the water.\", ar:\"التمساح في الماء.\", w:[\"alligator\"]},\n            {en:\"The plane is at the airport.\", ar:\"الطائرة في المطار.\", w:[\"airport\"]},\n            {en:\"Ask and answer.\", ar:\"اسأل وأجب.\", w:[\"ask\", \"answer\"]},\n            {en:\"I add an apricot.\", ar:\"أضيف مشمشة.\", w:[\"add\", \"apricot\"]},\n            {en:\"We agree again.\", ar:\"نحن نوافق مرة أخرى.\", w:[\"agree\", \"again\"]}\n        ],\n        families: [\n            {en:\"The fat cat has a hat.\", ar:\"القطة السمينة لديها قبعة.\", w:[\"fat\", \"cat\", \"hat\"]},\n            {en:\"The man has a van.\", ar:\"الرجل لديه شاحنة صغيرة.\", w:[\"man\", \"van\"]},\n            {en:\"My bag has a tag.\", ar:\"حقيبتي عليها بطاقة.\", w:[\"bag\", \"tag\"]},\n            {en:\"Dad is sad.\", ar:\"أبي حزين.\", w:[\"dad\", \"sad\"]},\n            {en:\"My cap is on the map.\", ar:\"قبعتي على الخريطة.\", w:[\"cap\", \"map\"]},\n            {en:\"I like jam.\", ar:\"أحب المربى.\", w:[\"jam\"]},\n            {en:\"I take a cab to the lab.\", ar:\"آخذ سيارة أجرة إلى المعمل.\", w:[\"cab\", \"lab\"]},\n            {en:\"I pay the tax.\", ar:\"أدفع الضريبة.\", w:[\"tax\"]}\n        ],\n        fourWords: [\n            {en:\"Raise your hand.\", ar:\"ارفع يدك.\", w:[\"hand\"]},\n            {en:\"I go to the bank.\", ar:\"أذهب إلى البنك.\", w:[\"bank\"]},\n            {en:\"He is fast.\", ar:\"هو سريع.\", w:[\"fast\"]},\n            {en:\"The park is dark.\", ar:\"الحديقة مظلمة.\", w:[\"park\", \"dark\"]},\n            {en:\"The dog can bark.\", ar:\"الكلب يستطيع النباح.\", w:[\"bark\"]},\n            {en:\"The farm is warm.\", ar:\"المزرعة دافئة.\", w:[\"farm\", \"warm\"]},\n            {en:\"I am smart.\", ar:\"أنا ذكي.\", w:[\"smart\"]},\n            {en:\"Pass the salt.\", ar:\"ناولني الملح.\", w:[\"salt\"]},\n            {en:\"I start the task.\", ar:\"أبدأ المهمة.\", w:[\"start\", \"task\"]},\n            {en:\"The shark is in the sea.\", ar:\"القرش في البحر.\", w:[\"shark\"]}\n        ]\n        },\n        // ===== VII. Reading sentences =====\n        story: [\n            [{en: \"The cat sat on the mat.\", ar: \"القطة جلست على السجادة.\"}],\n            [{en: \"A bat is in my hat.\", ar: \"يوجد خفاش في قبعتي.\"}],\n            [{en: \"Dad has a van.\", ar: \"أبي لديه شاحنة صغيرة.\"}],\n            [{en: \"The man ran to the camp.\", ar: \"الرجل ركض إلى المعسكر.\"}],\n            [{en: \"I am sad. I had a bad day.\", ar: \"أنا حزين. كان عندي يوم سيئ.\"}],\n            [{en: \"Ann has a map and a lamp.\", ar: \"آن لديها خريطة ومصباح.\"}]\n        ]\n    };\n\n    // ============================================================\n    // ⚙️ Engine (same engine as the lesson template)\n    // ============================================================\n    const synth = window.speechSynthesis;\n    let availableVoices = [];\n    let voiceLoadAttempt = 0;\n    const MAX_VOICE_ATTEMPTS = 6;\n    const RETRY_DELAYS = [0, 150, 400, 800, 1500, 2500];\n\n    function loadAvailableVoices() {\n        const vList = synth.getVoices();\n        if (vList.length) {\n            availableVoices = vList;\n            voiceLoadAttempt = 0;\n            populateVoiceDropdown();\n            return;\n        }\n        if (voiceLoadAttempt < MAX_VOICE_ATTEMPTS) {\n            const delay = RETRY_DELAYS[voiceLoadAttempt] || 2500;\n            voiceLoadAttempt++;\n            setTimeout(loadAvailableVoices, delay);\n        }\n    }\n\n    function voiceQualityScore(v) {\n        const name = (v.name || '').toLowerCase();\n        let score = 0;\n        if (name.includes('google')) score += 30;\n        if (name.includes('microsoft')) score += 25;\n        if (name.includes('samantha')) score += 20;\n        if (v.localService) score += 2;\n        return score;\n    }\n\n    function populateVoiceDropdown() {\n        const vs = document.getElementById('voice-select');\n        if (!vs || !availableVoices.length) return;\n        const normLang = (l) => String(l||'').replace('_','-').toLowerCase();\n        const enVoices = availableVoices.filter(v => {\n            const lang = normLang(v.lang);\n            return lang.startsWith('en-us') || lang.startsWith('en-gb');\n        });\n        if (!enVoices.length) return;\n        enVoices.sort((a,b) => voiceQualityScore(b) - voiceQualityScore(a));\n        const savedLang = localStorage.getItem('lesson_voice') || 'en-US';\n        const savedVoiceURI = localStorage.getItem('lesson_voiceURI') || '';\n        vs.innerHTML = '';\n        enVoices.forEach(v => {\n            const lang = String(v.lang||'').replace('_','-');\n            const isUS = lang.toLowerCase().startsWith('en-us');\n            const flag = isUS ? '🇺🇸 American' : '🇬🇧 British';\n            const opt = document.createElement('option');\n            opt.value = v.voiceURI;\n            opt.dataset.lang = lang;\n            opt.textContent = flag + ' — ' + v.name;\n            vs.appendChild(opt);\n        });\n        const savedOpt = [...vs.options].find(o => o.value === savedVoiceURI) ||\n                         [...vs.options].find(o => o.dataset.lang.toLowerCase().startsWith(savedLang.toLowerCase()));\n        if (savedOpt) vs.value = savedOpt.value;\n    }\n\n    function getBestVoice() {\n        const vs = document.getElementById('voice-select');\n        if (!vs) return null;\n        const selectedURI = vs.value;\n        const found = availableVoices.find(v => v.voiceURI === selectedURI);\n        if (found) return found;\n        const targetLang = vs.options[vs.selectedIndex]?.dataset?.lang || vs.value || 'en-US';\n        const normTarget = targetLang.toLowerCase().replace('_','-');\n        const matches = availableVoices.filter(v => {\n            const vl = String(v.lang||'').replace('_','-').toLowerCase();\n            return vl === normTarget || vl.startsWith(normTarget + '-') || vl.startsWith(normTarget.split('-')[0] + '-' + normTarget.split('-')[1]);\n        });\n        if (matches.length) {\n            matches.sort((a,b) => voiceQualityScore(b) - voiceQualityScore(a));\n            return matches[0];\n        }\n        return null;\n    }\n\n    function getSelectedLang() {\n        const vs = document.getElementById('voice-select');\n        if (!vs) return 'en-US';\n        const opt = vs.options[vs.selectedIndex];\n        return (opt && opt.dataset && opt.dataset.lang) || vs.value || 'en-US';\n    }\n\n    loadAvailableVoices();\n    if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadAvailableVoices;\n\n    let speechQueue = [];\n    let isPlaying = false;\n    let currentSpeakingElement = null;\n\n    function loadPrefs() {\n        try {\n            const voice = localStorage.getItem('lesson_voice') || 'en-US';\n            const speed = localStorage.getItem('lesson_speed') || '0.9';\n            const theme = localStorage.getItem('lesson_theme') || 'green';\n            document.getElementById('voice-select').value = voice;\n            document.getElementById('speed-slider').value = speed;\n            document.getElementById('speed-value').innerText = speed + 'x';\n            applyTheme(theme);\n            document.querySelectorAll('.theme-dot').forEach(d => {\n                d.classList.toggle('active', d.dataset.theme === theme);\n            });\n        } catch(e) {}\n    }\n    function savePrefs() {\n        try {\n            localStorage.setItem('lesson_voice', getSelectedLang());\n            localStorage.setItem('lesson_voiceURI', document.getElementById('voice-select').value);\n            localStorage.setItem('lesson_speed', document.getElementById('speed-slider').value);\n            localStorage.setItem('lesson_theme', document.querySelector('.theme-dot.active')?.dataset?.theme || 'green');\n        } catch(e) {}\n    }\n\n    const themes = {\n        green:  { accent:'#2e7d32', highlight:'#c8e6c9', speak:'#1b5e20', play:'#4caf50', border:'#81c784' },\n        blue:   { accent:'#1565c0', highlight:'#bbdefb', speak:'#0d47a1', play:'#1e88e5', border:'#64b5f6' },\n        orange: { accent:'#ef6c00', highlight:'#ffe0b2', speak:'#e65100', play:'#fb8c00', border:'#ffb74d' },\n        pink:   { accent:'#d81b60', highlight:'#f8bbd0', speak:'#ad1457', play:'#ec407a', border:'#f48fb1' }\n    };\n    function applyTheme(t) {\n        const theme = themes[t];\n        if(!theme) return;\n        const root = document.documentElement.style;\n        root.setProperty('--accent-color', theme.accent);\n        root.setProperty('--highlight-color', theme.highlight);\n        root.setProperty('--speak-highlight', theme.speak);\n        root.setProperty('--play-all-btn', theme.play);\n        root.setProperty('--border-color', theme.border);\n    }\n\n    function cancelSpeech() {\n        synth.cancel();\n        isPlaying = false;\n        speechQueue = [];\n        if (currentSpeakingElement) {\n            currentSpeakingElement.classList.remove('speaking-highlight');\n            currentSpeakingElement = null;\n        }\n    }\n\n    function speakText(text, element) {\n        if (!text) return;\n        cancelSpeech();\n        const utter = new SpeechSynthesisUtterance(text);\n        utter.lang = getSelectedLang();\n        { const _v = getBestVoice(); if (_v) utter.voice = _v; }\n        utter.rate = parseFloat(document.getElementById('speed-slider').value);\n\n        if (element) {\n            element.classList.add('speaking-highlight');\n            currentSpeakingElement = element;\n            element.scrollIntoView({ behavior: 'smooth', block: 'center' });\n            utter.onend = () => {\n                if (currentSpeakingElement) {\n                    currentSpeakingElement.classList.remove('speaking-highlight');\n                    currentSpeakingElement = null;\n                }\n                isPlaying = false;\n            };\n            utter.onerror = () => {\n                if (currentSpeakingElement) {\n                    currentSpeakingElement.classList.remove('speaking-highlight');\n                    currentSpeakingElement = null;\n                }\n                isPlaying = false;\n            };\n        }\n        synth.speak(utter);\n        isPlaying = true;\n    }\n\n    function playQueue(elements) {\n        cancelSpeech();\n        if (!elements || elements.length === 0) return;\n        let index = 0;\n        speechQueue = [...elements];\n        isPlaying = true;\n\n        function next() {\n            if (!isPlaying || index >= speechQueue.length) {\n                isPlaying = false;\n                return;\n            }\n            const el = speechQueue[index];\n            const text = (el.dataset.say || el.innerText).trim();\n            if (!text) { index++; next(); return; }\n\n            const utter = new SpeechSynthesisUtterance(text);\n            utter.lang = getSelectedLang();\n            { const _v = getBestVoice(); if (_v) utter.voice = _v; }\n            utter.rate = parseFloat(document.getElementById('speed-slider').value);\n\n            el.classList.add('speaking-highlight');\n            currentSpeakingElement = el;\n            el.scrollIntoView({ behavior: 'smooth', block: 'center' });\n\n            utter.onend = () => {\n                if (currentSpeakingElement) {\n                    currentSpeakingElement.classList.remove('speaking-highlight');\n                    currentSpeakingElement = null;\n                }\n                index++;\n                if (isPlaying) next();\n                else isPlaying = false;\n            };\n            utter.onerror = () => {\n                if (currentSpeakingElement) {\n                    currentSpeakingElement.classList.remove('speaking-highlight');\n                    currentSpeakingElement = null;\n                }\n                index++;\n                if (isPlaying) next();\n                else isPlaying = false;\n            };\n            synth.speak(utter);\n        }\n        next();\n    }\n\n    // ---------- helpers for this lesson ----------\n    // يلوّن أول حرف a في الكلمة بالأحمر (زي الشارتات)\n    function markA(text) {\n        const i = text.toLowerCase().indexOf('a');\n        if (i < 0) return text;\n        return text.slice(0, i) + '<span class=\"va\">' + text[i] + '<\/span>' + text.slice(i + 1);\n    }\n\n    function makeSpeakSpan(text, mark) {\n        const span = document.createElement('span');\n        span.className = 'vocab-element';\n        if (mark) span.innerHTML = markA(text); else span.innerText = text;\n        const say = lessonData.say[text];\n        if (say) span.dataset.say = say;\n        span.onclick = () => speakText(say || text, span);\n        return span;\n    }\n\n    function fillPairs(tbody, data, mark, collector) {\n        tbody.innerHTML = '';\n        for (let i = 0; i < data.length; i += 2) {\n            const tr = document.createElement('tr');\n            [i, i + 1].forEach(idx => {\n                if (data[idx]) {\n                    const tdEn = document.createElement('td');\n                    tdEn.className = 'english-cell';\n                    const span = makeSpeakSpan(data[idx].en, mark);\n                    tdEn.appendChild(span);\n                    const tdAr = document.createElement('td');\n                    tdAr.className = 'arabic-cell';\n                    tdAr.innerText = data[idx].ar;\n                    tr.append(tdEn, tdAr);\n                    collector.push(span);\n                }\n            });\n            tbody.appendChild(tr);\n        }\n    }\n\n    function fillChips(gridId, items, collector) {\n        const grid = document.getElementById(gridId);\n        grid.innerHTML = '';\n        items.forEach(t => {\n            const span = makeSpeakSpan(t, true);\n            grid.appendChild(span);\n            collector.push(span);\n        });\n    }\n\n    function initLesson() {\n        const meta = lessonData.meta;\n        document.getElementById('main-title').innerText = meta.mainTitle;\n        document.getElementById('sub-title').innerText = meta.subTitle;\n        document.getElementById('play-all-sounds-btn').innerText = meta.playAllSounds;\n        document.getElementById('play-all-words-btn').innerText = meta.playAllWords;\n        document.getElementById('play-all-story-btn').innerText = meta.playAllStory;\n\n        const soundEls = [];\n        const wordEls = [];\n\n        // I. intro sentences\n        const introTbody = document.querySelector('#intro tbody');\n        introTbody.innerHTML = '';\n        lessonData.intro.forEach(k => {\n            const tr = document.createElement('tr');\n            const tdEn = document.createElement('td');\n            tdEn.className = 'english-cell';\n            const span = makeSpeakSpan(k.en, false);\n            tdEn.appendChild(span);\n            const tdAr = document.createElement('td');\n            tdAr.className = 'arabic-cell';\n            tdAr.innerText = k.ar;\n            tr.append(tdEn, tdAr);\n            introTbody.appendChild(tr);\n            soundEls.push(span);\n        });\n\n        // II + III. blends\n        fillChips('blends-grid', lessonData.blends, soundEls);\n        fillChips('cons-grid', lessonData.consA, soundEls);\n\n        // IV. A words\n        fillPairs(document.querySelector('#a-words tbody'), lessonData.aWords, true, wordEls);\n\n        // V. families\n        const famBox = document.getElementById('families');\n        famBox.innerHTML = '';\n        lessonData.families.forEach(f => {\n            const block = document.createElement('div');\n            block.className = 'family-block';\n            const title = document.createElement('div');\n            title.className = 'family-title';\n            title.innerText = 'Family ' + f.name;\n            const wrap = document.createElement('div');\n            wrap.className = 'table-wrap';\n            const table = document.createElement('table');\n            const tbody = document.createElement('tbody');\n            table.appendChild(tbody);\n            wrap.appendChild(table);\n            block.append(title, wrap);\n            famBox.appendChild(block);\n            fillPairs(tbody, f.words, true, wordEls);\n        });\n\n        // VI. 4-letter words\n        fillPairs(document.querySelector('#four-words tbody'), lessonData.fourWords, true, wordEls);\n\n        // VII. reading\n        const sBox = document.getElementById('story-container');\n        sBox.innerHTML = '';\n        const storySentences = [];\n        lessonData.story.forEach(paragraph => {\n            const partDiv = document.createElement('div');\n            partDiv.className = 'reading-paragraph';\n            paragraph.forEach(sentence => {\n                const line = document.createElement('div');\n                const sentSpan = document.createElement('span');\n                sentSpan.className = 'english-sentence';\n                sentSpan.innerText = sentence.en;\n                sentSpan.onclick = () => speakText(sentence.en, sentSpan);\n\n                const arSpan = document.createElement('span');\n                arSpan.className = 'arabic-translation';\n                arSpan.innerText = sentence.ar;\n\n                line.appendChild(sentSpan);\n                line.appendChild(arSpan);\n                partDiv.appendChild(line);\n                storySentences.push(sentSpan);\n            });\n            sBox.appendChild(partDiv);\n        });\n\n                // ---------- جمل أمثلة بعد كل قسم ----------\n        function markWords(text, words) {\n            let out = text;\n            words.forEach(w => {\n                out = out.replace(new RegExp('\\\\b(' + w + ')(s)?\\\\b', 'gi'), '<span class=\"va\">$1$2<\/span>');\n            });\n            return out;\n        }\n        function buildExamples(boxId, list) {\n            const box = document.getElementById(boxId);\n            box.innerHTML = '';\n            const title = document.createElement('div');\n            title.className = 'ex-title';\n            title.innerText = '✏️ Example Sentences (جمل أمثلة)';\n            box.appendChild(title);\n            const spans = [];\n            const btn = document.createElement('button');\n            btn.className = 'play-btn';\n            btn.innerText = '▶️ نطق جمل الأمثلة';\n            box.appendChild(btn);\n            list.forEach(item => {\n                const p = document.createElement('div');\n                p.className = 'reading-paragraph';\n                const s = document.createElement('span');\n                s.className = 'english-sentence';\n                s.innerHTML = markWords(item.en, item.w);\n                s.onclick = () => speakText(item.en, s);\n                const a = document.createElement('span');\n                a.className = 'arabic-translation';\n                a.innerText = item.ar;\n                p.append(s, a);\n                box.appendChild(p);\n                spans.push(s);\n            });\n            btn.onclick = () => playQueue(spans);\n        }\n        buildExamples('ex-a', lessonData.examples.aWords);\n        buildExamples('ex-fam', lessonData.examples.families);\n        buildExamples('ex-four', lessonData.examples.fourWords);\n\n        document.getElementById('play-all-sounds-btn').onclick = () => playQueue(soundEls);\n        document.getElementById('play-all-words-btn').onclick = () => playQueue(wordEls);\n        document.getElementById('play-all-story-btn').onclick = () => playQueue(storySentences);\n        document.getElementById('stop-btn').onclick = cancelSpeech;\n\n        buildQuiz();\n        document.getElementById('quiz-reset-btn').onclick = buildQuiz;\n\n        document.getElementById('voice-select').onchange = savePrefs;\n        document.getElementById('speed-slider').oninput = () => {\n            document.getElementById('speed-value').innerText = document.getElementById('speed-slider').value + 'x';\n            savePrefs();\n        };\n        document.querySelectorAll('.theme-dot').forEach(dot => {\n            dot.onclick = () => {\n                document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));\n                dot.classList.add('active');\n                applyTheme(dot.dataset.theme);\n                savePrefs();\n            };\n        });\n    }\n\n    // ---------- Quiz ----------\n    let quizPool = [], quizItems = [], quizIndex = 0, quizScore = 0;\n\n    function shuffle(arr) {\n        for (let i = arr.length - 1; i > 0; i--) {\n            const j = Math.floor(Math.random() * (i + 1));\n            [arr[i], arr[j]] = [arr[j], arr[i]];\n        }\n        return arr;\n    }\n\n    function fireConfetti(container) {\n        const colors = ['#e53935', '#fb8c00', '#fdd835', '#43a047', '#1e88e5', '#8e24aa'];\n        for (let i = 0; i < 28; i++) {\n            const conf = document.createElement('div');\n            conf.className = 'confetti-piece';\n            conf.style.left = (35 + Math.random() * 30) + '%';\n            conf.style.background = colors[Math.floor(Math.random() * colors.length)];\n            conf.style.animationDelay = (Math.random() * 0.25) + 's';\n            conf.style.setProperty('--x', (Math.random() * 220 - 110) + 'px');\n            container.appendChild(conf);\n            setTimeout(() => conf.remove(), 1400);\n        }\n    }\n\n    function buildQuiz() {\n        const famWords = lessonData.families.flatMap(f => f.words);\n        const allVocab = [...lessonData.aWords, ...famWords, ...lessonData.fourWords];\n        quizPool = shuffle([...allVocab]);\n        quizItems = quizPool.slice(0, Math.min(10, quizPool.length));\n        quizIndex = 0; quizScore = 0;\n        document.getElementById('quiz-score').innerText = '';\n        document.getElementById('quiz-reset-btn').style.display = 'none';\n        showQuizQuestion();\n    }\n\n    function showQuizQuestion() {\n        const quizBox = document.getElementById('quiz-container');\n        const progress = document.getElementById('quiz-progress');\n        const feedback = document.getElementById('quiz-feedback');\n        const scoreDiv = document.getElementById('quiz-score');\n        feedback.innerText = ''; feedback.className = 'quiz-feedback';\n        quizBox.innerHTML = '';\n\n        if (quizIndex >= quizItems.length) {\n            progress.innerText = '';\n            scoreDiv.innerText = `🏆 انتهى الاختبار! نتيجتك: ${quizScore} / ${quizItems.length}`;\n            document.getElementById('quiz-reset-btn').style.display = 'inline-block';\n            return;\n        }\n\n        progress.innerText = `سؤال ${quizIndex + 1} من ${quizItems.length}`;\n        const item = quizItems[quizIndex];\n\n        // اختيارات خاطئة بمعاني مختلفة وغير مكررة\n        const seen = new Set([item.ar]);\n        const distractors = [];\n        for (const p of shuffle([...quizPool])) {\n            if (!seen.has(p.ar)) { seen.add(p.ar); distractors.push(p.ar); }\n            if (distractors.length === 3) break;\n        }\n        const options = shuffle([item.ar, ...distractors]);\n\n        const qDiv = document.createElement('div'); qDiv.className = 'quiz-question'; qDiv.style.position = 'relative';\n        qDiv.innerHTML = `<p class=\"q-text\">ما معنى كلمة \"<span style=\"color:var(--accent-color)\">${item.en}<\/span>\"؟<\/p>`;\n        const optWrap = document.createElement('div'); optWrap.className = 'quiz-options';\n        let locked = false;\n\n        options.forEach(opt => {\n            const optBtn = document.createElement('div');\n            optBtn.className = 'quiz-option';\n            optBtn.innerText = opt;\n            optBtn.onclick = () => {\n                if (locked) return;\n                locked = true;\n                document.querySelectorAll('.quiz-option').forEach(b => b.style.pointerEvents = 'none');\n\n                if (opt === item.ar) {\n                    optBtn.classList.add('correct');\n                    feedback.innerText = '🎉 إجابة صحيحة!'; feedback.className = 'quiz-feedback correct';\n                    fireConfetti(qDiv);\n                    speakText('Correct!');\n                    quizScore++;\n                    setTimeout(() => { quizIndex++; showQuizQuestion(); }, 1200);\n                } else {\n                    optBtn.classList.add('wrong');\n                    document.querySelectorAll('.quiz-option').forEach(b => {\n                        if (b.innerText === item.ar) b.classList.add('show-correct');\n                    });\n                    feedback.innerText = `❌ خطأ! الإجابة الصحيحة: \"${item.ar}\"`;\n                    feedback.className = 'quiz-feedback wrong';\n                    speakText('Wrong!');\n                    setTimeout(() => { quizIndex++; showQuizQuestion(); }, 2000);\n                }\n            };\n            optWrap.appendChild(optBtn);\n        });\n        qDiv.appendChild(optWrap);\n        quizBox.appendChild(qDiv);\n    }\n\n    window.onload = () => {\n        loadPrefs();\n        initLesson();\n    };\n<\/script>\n<\/body>\n<\/html>\n", "E": "<!DOCTYPE html>\n<html lang=\"ar\" dir=\"ltr\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Level 1 - Short Vowels: Short E<\/title>\n    <link href=\"https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Roboto:wght@400;700&display=swap\" rel=\"stylesheet\">\n    <style>\n        :root {\n            --bg-color: #f0f4f8; --card-color: #ffffff; --accent-color: #2e7d32;\n            --text-color: #212121; --highlight-color: #c8e6c9; --speak-highlight: #1b5e20;\n            --play-all-btn: #4caf50; --secondary-text-color: #424242; --border-color: #81c784;\n            --speech-glow: #ffeb3b;\n        }\n        * { box-sizing: border-box; }\n        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; text-align: center; color: var(--text-color); transition: background-color 0.3s; }\n        .container { max-width: 1000px; margin: 0 auto 50px auto; background-color: var(--card-color); border-radius: 25px; box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15); padding: 40px; border: 8px solid var(--accent-color); transition: border-color 0.3s; }\n        h1 { color: var(--accent-color); font-size: 2.5em; margin-bottom: 10px; }\n        h2 { color: var(--speak-highlight); border-bottom: 2px solid var(--border-color); display: inline-block; padding-bottom: 5px; }\n        h3 { background-color: var(--highlight-color); padding: 12px; border-radius: 10px; margin-top: 30px; text-align: right; direction: ltr; font-size: 1.6em; }\n\n        .speech-controls { background: #e8f5e9; padding: 15px; border-radius: 15px; margin-bottom: 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; align-items: center; }\n        .control-group { display: flex; align-items: center; gap: 8px; font-weight: bold; }\n        #speed-value { min-width: 32px; display: inline-block; font-weight: bold; color: var(--accent-color); }\n\n        .theme-switcher { display: flex; gap: 8px; align-items: center; }\n        .theme-dot { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; box-shadow: 0 0 0 1px #999; }\n        .theme-dot.active { box-shadow: 0 0 0 2px #333; }\n\n        .table-wrap { width: 100%; overflow-x: auto; }\n        table { width: 100%; min-width: 320px; border-collapse: separate; border-spacing: 0; margin-top: 15px; text-align: right; border-radius: 15px; overflow: hidden; }\n        th, td { border: 1px solid var(--border-color); padding: 12px; }\n        th { background-color: var(--accent-color); color: white; }\n        td:nth-child(odd) { background-color: #f1f8e9; }\n\n        .english-cell { text-align: left !important; direction: ltr !important; }\n        .arabic-cell { text-align: right !important; direction: rtl !important; }\n\n        .play-btn { background-color: var(--play-all-btn); color: white; border: none; padding: 12px 25px; border-radius: 12px; cursor: pointer; font-size: 1.1em; box-shadow: 0 5px #388e3c; margin: 10px 6px; transition: 0.1s; font-family: 'Cairo', sans-serif; }\n        .play-btn:active { transform: translateY(3px); box-shadow: 0 2px #388e3c; }\n\n        .vocab-element, .english-sentence {\n            cursor: pointer; transition: 0.2s; padding: 4px 8px; border-radius: 4px; display: inline-block;\n            font-family: 'Roboto', sans-serif; font-weight: 700; color: #1a237e;\n            border: 2px solid transparent;\n            direction: ltr !important; text-align: left;\n        }\n        .vocab-element:hover, .english-sentence:hover { background-color: var(--highlight-color); }\n        .english-sentence { display: block; text-align: left; margin-bottom: 5px; color: #000; }\n        .speaking-highlight {\n            background-color: var(--speak-highlight) !important;\n            color: white !important;\n            border-color: var(--speech-glow) !important;\n            box-shadow: 0 0 15px var(--speech-glow);\n            transform: scale(1.02);\n        }\n        .va { color: #e53935; }\n        .speaking-highlight .va { color: var(--speech-glow); }\n\n        .arabic-translation {\n            display: block; text-align: right; direction: rtl !important;\n            color: var(--secondary-text-color); border-bottom: 1px dashed #ccc;\n            margin-bottom: 15px; padding-bottom: 5px; font-size: 1.05em; font-weight: bold;\n        }\n\n        .reading-paragraph { margin-bottom: 16px; padding: 15px; background: #f9f9f9; border-radius: 10px; text-align: left; }\n\n        .chip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 10px; margin-top: 15px; direction: ltr; }\n        .chip-grid .vocab-element { font-size: 1.7em; text-align: center; padding: 10px 6px; background: #f1f8e9; border: 2px solid var(--border-color); border-radius: 12px; }\n        .chip-grid .vocab-element:hover { background-color: var(--highlight-color); }\n        .chip-grid .vocab-element.speaking-highlight { background-color: var(--speak-highlight) !important; }\n        .formula { font-family: 'Roboto', sans-serif; font-weight: 700; direction: ltr; background: #fffde7; border: 2px dashed var(--border-color); border-radius: 10px; padding: 8px 12px; margin-top: 12px; display: inline-block; }\n        .family-title { display: inline-block; background: var(--accent-color); color: #fff; font-family: 'Roboto', sans-serif; padding: 6px 18px; border-radius: 10px; margin: 22px 0 0 0; font-size: 1.2em; direction: ltr; }\n        .family-block { text-align: left; }\n\n        .floating-stop-btn { position: fixed; bottom: 25px; right: 25px; z-index: 1000; background:#d32f2f; color:white; border:none; border-radius:50%; width:64px; height:64px; font-size:1.6em; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,0.35); display:flex; align-items:center; justify-content:center; transition: transform 0.15s; }\n        .floating-stop-btn:active { transform: scale(0.92); }\n\n        .quiz-question { background:#f9f9f9; border:2px solid var(--border-color); border-radius:12px; padding:15px; margin-bottom:15px; text-align:left; direction:ltr; }\n        .quiz-question p.q-text { font-size:1.15em; font-weight:bold; margin:0 0 10px 0; color:var(--text-color); }\n        .quiz-options { display:flex; flex-direction:column; gap:8px; }\n        .quiz-option { background:#fff; border:2px solid var(--border-color); border-radius:8px; padding:10px 15px; cursor:pointer; text-align:left; font-family:'Roboto',sans-serif; font-weight:700; transition:0.2s; direction:ltr; }\n        .quiz-option:hover { background: var(--highlight-color); }\n        .quiz-option.correct { background:#a5d6a7 !important; border-color:#2e7d32; color: #1b5e20; }\n        .quiz-option.wrong { background:#ef9a9a !important; border-color:#c62828; text-decoration: line-through; }\n        .quiz-option.show-correct { background:#a5d6a7 !important; border-color:#2e7d32; }\n        .quiz-score { font-size:1.3em; font-weight:bold; color:var(--accent-color); margin-top:15px; }\n        #quiz-progress { font-weight:bold; color:var(--secondary-text-color); margin-bottom:8px; }\n        .quiz-feedback { font-size:1.4em; font-weight:bold; margin-top:10px; min-height:1.4em; }\n        .quiz-feedback.correct { color:#2e7d32; }\n        .quiz-feedback.wrong { color:#c62828; }\n        .confetti-piece { position:absolute; top:10%; width:8px; height:8px; opacity:0.95; pointer-events:none; animation: confetti-fall 1.1s ease-out forwards; }\n        @keyframes confetti-fall { to { transform: translate(var(--x), 200px) rotate(720deg); opacity:0; } }\n\n\n        .examples { text-align: left; margin-top: 18px; border: 2px dashed var(--border-color); border-radius: 14px; padding: 14px; background: #fcfffc; }\n        .ex-title { font-weight: 700; color: var(--accent-color); margin-bottom: 8px; direction: ltr; }\n        .examples .reading-paragraph { background: #fff; border: 1px solid var(--border-color); margin-bottom: 10px; }\n        .examples .play-btn { margin: 4px 0 10px 0; }\n\n        @media (max-width: 700px) {\n            body { padding: 10px; }\n            .container { padding: 20px 15px; border-radius: 18px; border-width: 5px; }\n            h1 { font-size: 1.7em; }\n            h3 { font-size: 1.2em; padding: 10px; }\n            .speech-controls { padding: 10px; gap: 10px; }\n            .control-group { font-size: 0.9em; }\n            th, td { padding: 8px 6px; font-size: 0.9em; }\n            .play-btn { padding: 10px 18px; font-size: 1em; width: 100%; margin: 6px 0; }\n            .reading-paragraph { padding: 10px; }\n            .english-sentence { font-size: 1.05em; }\n            .chip-grid { grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; }\n            .chip-grid .vocab-element { font-size: 1.4em; }\n            .floating-stop-btn { width: 52px; height: 52px; font-size: 1.3em; bottom: 15px; right: 15px; }\n        }\n        @media (max-width: 420px) {\n            th, td { padding: 6px 4px; font-size: 0.8em; }\n            h1 { font-size: 1.4em; }\n        }\n    <\/style>\n<\/head>\n<body>\n<div style=\"position:sticky; top:0; background-color:#ffffff; padding:15px 0; text-align:center; font-family:Arial, sans-serif; box-shadow:0 4px 6px rgba(0,0,0,0.1); z-index:1000; display:flex; flex-direction:column; align-items:center;\">\n  <h3 style=\"margin:2px 0; color:#333; text-align:center;\">Ms. Engy Taha (Ms. Samia)<\/h3>\n  <div style=\"margin-top:8px;\">\n    <a href=\"tel:+201150231594\" style=\"display:inline-block; background-color:#007BFF; color:#fff; padding:8px 16px; margin:3px; border-radius:5px; text-decoration:none; font-weight:bold;\">\n      📞 01150231594\n    <\/a>\n    <a href=\"https://wa.me/+201150231594\" target=\"_blank\" style=\"display:inline-block; background-color:#25D366; color:#fff; padding:8px 16px; margin:3px; border-radius:5px; text-decoration:none; font-weight:bold;\">\n      💬 تواصل عبر الواتس\n    <\/a>\n  <\/div>\n<\/div>\n\n<div class=\"container\">\n    <h1 id=\"main-title\">📚 Loading...<\/h1>\n    <h2 id=\"sub-title\"><\/h2>\n\n    <div class=\"speech-controls\">\n        <div class=\"control-group\"><label>🗣️ اللكنة:<\/label>\n            <select id=\"voice-select\"><option value=\"en-US\">American (US) 🇺🇸<\/option><option value=\"en-GB\">British (UK) 🇬🇧<\/option><\/select>\n        <\/div>\n        <div class=\"control-group\"><label>⚡ السرعة:<\/label>\n            <input type=\"range\" id=\"speed-slider\" min=\"0.5\" max=\"1.2\" value=\"0.9\" step=\"0.1\">\n            <span id=\"speed-value\">0.9x<\/span>\n        <\/div>\n        <div class=\"theme-switcher\">\n            <label>🎨<\/label>\n            <span class=\"theme-dot active\" data-theme=\"green\" style=\"background:#2e7d32;\"><\/span>\n            <span class=\"theme-dot\" data-theme=\"blue\" style=\"background:#1565c0;\"><\/span>\n            <span class=\"theme-dot\" data-theme=\"orange\" style=\"background:#ef6c00;\"><\/span>\n            <span class=\"theme-dot\" data-theme=\"pink\" style=\"background:#d81b60;\"><\/span>\n        <\/div>\n    <\/div>\n\n    <button id=\"play-all-sounds-btn\" class=\"play-btn\">▶️ نطق الأصوات والدمج<\/button>\n    <button id=\"play-all-words-btn\" class=\"play-btn\">▶️ نطق جميع الكلمات<\/button>\n\n    <h3 id=\"intro-title\">🔤 I. Letters & Vowels (الحروف والحركات)<\/h3>\n    <div class=\"table-wrap\"><table id=\"intro\"><tbody><\/tbody><\/table><\/div>\n\n    <h3 id=\"blends-title\">🧩 II. Short E Blends: e + Consonant (دمج e مع حرف ساكن)<\/h3>\n    <div class=\"formula\">e + b = eb<\/div>\n    <div id=\"blends-grid\" class=\"chip-grid\"><\/div>\n\n    <h3 id=\"cons-title\">🧩 III. Consonant + e (دمج حرف ساكن مع e)<\/h3>\n    <div class=\"formula\">B + e = be &nbsp;|&nbsp; K + e = ke &nbsp;|&nbsp; D + e = de<\/div>\n    <div id=\"cons-grid\" class=\"chip-grid\"><\/div>\n\n    <h3 id=\"awords-title\">🥚 IV. Words that Start with E (كلمات تبدأ بـ E)<\/h3>\n    <div class=\"table-wrap\"><table id=\"a-words\"><tbody><\/tbody><\/table><\/div>\n    <div id=\"ex-a\" class=\"examples\"><\/div>\n\n    <h3 id=\"fam-title\">👨‍👩‍👧 V. Short E Word Families - 3 Letters (عائلات الكلمات)<\/h3>\n    <div id=\"families\"><\/div>\n    <div id=\"ex-fam\" class=\"examples\"><\/div>\n\n    <h3 id=\"four-title\">🔠 VI. Short E Words - 4 Letters (كلمات من 4 حروف)<\/h3>\n    <div class=\"table-wrap\"><table id=\"four-words\"><tbody><\/tbody><\/table><\/div>\n    <div id=\"ex-four\" class=\"examples\"><\/div>\n\n    <h3 id=\"story-title\">📖 VII. Sound it. Blend it. Read it! (اقرأ الجمل)<\/h3>\n    <button id=\"play-all-story-btn\" class=\"play-btn\">▶️ نطق الجمل كاملة<\/button>\n    <div id=\"story-container\" style=\"text-align:left; border: 2px solid var(--accent-color); padding: 20px; border-radius: 15px; margin-top:10px;\"><\/div>\n\n    <h3 id=\"quiz-title\">📝 VIII. Quick Quiz (اختبار سريع)<\/h3>\n    <div id=\"quiz-progress\"><\/div>\n    <div id=\"quiz-container\"><\/div>\n    <div id=\"quiz-feedback\" class=\"quiz-feedback\"><\/div>\n    <div id=\"quiz-score\" class=\"quiz-score\"><\/div>\n    <button id=\"quiz-reset-btn\" class=\"play-btn\" style=\"display:none;\">🔄 إعادة الاختبار<\/button>\n<\/div>\n\n<button id=\"stop-btn\" class=\"floating-stop-btn\" title=\"إيقاف النطق\">⏹️<\/button>\n\n<script>\n    // ============================================================\n    // 🟢 Lesson Data: Level 1 - Short Vowels - Short E\n    // ============================================================\n    const lessonData = {\n        meta: {\n            mainTitle: \"🥚 Level 1 - Short Vowels: Short E\",\n            subTitle: \"Phonics is Fun! - Step by Step with Miss Engy Taha\",\n            playAllSounds: \"▶️ نطق الأصوات والدمج\",\n            playAllWords: \"▶️ نطق جميع الكلمات\",\n            playAllStory: \"▶️ نطق الجمل كاملة\"\n        },\n\n        // ===== I. Letters & Vowels =====\n        intro: [\n            {en: \"We have 26 letters.\", ar: \"لدينا 26 حرفًا.\"},\n            {en: \"We have 5 vowels: a, e, i, o, u.\", ar: \"لدينا 5 حروف علة: a, e, i, o, u.\"},\n            {en: \"Short E says e, as in egg.\", ar: \"حرف E القصير ينطق /e/ مثل egg.\"},\n            {en: \"Sound it. Blend it. Read it!\", ar: \"انطقه. ادمجه. اقرأه!\"}\n        ],\n\n        // ===== II. e + consonant =====\n        blends: [\"eb\", \"ec\", \"ed\", \"ef\", \"eg\", \"eh\", \"ej\", \"ek\", \"el\", \"em\", \"en\", \"ep\", \"er\", \"es\", \"et\", \"ev\", \"ew\", \"ex\", \"ey\", \"ez\"],\n\n        // ===== III. consonant + e =====\n        consA: [\"be\", \"ce\", \"de\", \"fe\", \"ge\", \"he\", \"je\", \"ke\", \"le\", \"me\", \"ne\", \"pe\", \"qe\", \"re\", \"se\", \"te\", \"ve\", \"we\", \"xe\", \"ye\", \"ze\"],\n\n        // ===== نطق الأصوات: الشاشة تعرض الحرفين، والصوت يقرأ الكتابة الصوتية =====\n        // (عشان المتصفح ما يقرأهم كحروف منفصلة. عدّلي أي نطق من هنا)\n        say: {\"eb\": \"ebb\", \"ec\": \"eck\", \"ed\": \"Ed\", \"ef\": \"eff\", \"eg\": \"egg\", \"eh\": \"eh\", \"ej\": \"edge\", \"ek\": \"eck\", \"el\": \"ell\", \"em\": \"Em\", \"en\": \"en\", \"ep\": \"epp\", \"er\": \"err\", \"es\": \"ess\", \"et\": \"ett\", \"ev\": \"Ev\", \"ew\": \"ew\", \"ex\": \"ex\", \"ey\": \"ay\", \"ez\": \"ezz\", \"be\": \"beh\", \"ce\": \"keh\", \"de\": \"deh\", \"fe\": \"feh\", \"ge\": \"geh\", \"he\": \"heh\", \"je\": \"jeh\", \"ke\": \"keh\", \"le\": \"leh\", \"me\": \"meh\", \"ne\": \"neh\", \"pe\": \"peh\", \"qe\": \"kweh\", \"re\": \"reh\", \"se\": \"seh\", \"te\": \"teh\", \"ve\": \"veh\", \"we\": \"weh\", \"xe\": \"zeh\", \"ye\": \"yeh\", \"ze\": \"zeh\"},\n\n        // ===== IV. Words starting with E =====\n        aWords: [\n            {en:\"ear\", ar:\"أذن\"}, {en:\"eat\", ar:\"يأكل\"}, {en:\"egg\", ar:\"بيضة\"}, {en:\"elephant\", ar:\"فيل\"},\n            {en:\"elbow\", ar:\"مرفق\"}, {en:\"engine\", ar:\"محرك\"}, {en:\"eye\", ar:\"عين\"}, {en:\"eagle\", ar:\"نسر\"},\n            {en:\"earth\", ar:\"الأرض\"}, {en:\"exit\", ar:\"خروج\"}, {en:\"envelope\", ar:\"ظرف\"}, {en:\"eraser\", ar:\"ممحاة\"},\n            {en:\"earring\", ar:\"حلق\"}, {en:\"easy\", ar:\"سهل\"}, {en:\"exam\", ar:\"امتحان\"}, {en:\"everyone\", ar:\"الجميع\"},\n            {en:\"event\", ar:\"حدث\"}, {en:\"energy\", ar:\"طاقة\"}, {en:\"elf\", ar:\"قزم\"}, {en:\"email\", ar:\"بريد إلكتروني\"},\n            {en:\"enough\", ar:\"كافٍ\"}, {en:\"enjoy\", ar:\"يستمتع\"}, {en:\"episode\", ar:\"حلقة\"}, {en:\"elevator\", ar:\"مصعد\"},\n            {en:\"edit\", ar:\"يحرر\"}, {en:\"effect\", ar:\"تأثير\"}, {en:\"eleven\", ar:\"أحد عشر\"}, {en:\"eighty\", ar:\"ثمانون\"},\n            {en:\"empty\", ar:\"فارغ\"}, {en:\"escape\", ar:\"يهرب\"}, {en:\"exercise\", ar:\"تمرين\"}, {en:\"excited\", ar:\"متحمس\"},\n            {en:\"explain\", ar:\"يشرح\"}, {en:\"extra\", ar:\"إضافي\"}, {en:\"extend\", ar:\"يمد\"}, {en:\"exist\", ar:\"يكون / يوجد\"},\n            {en:\"end\", ar:\"نهاية\"}, {en:\"eight\", ar:\"ثمانية\"}\n        ],\n\n        // ===== V. Word families (3 letters) =====\n        families: [\n            {name:\"-en\", words:[{en:\"pen\", ar:\"قلم\"}, {en:\"hen\", ar:\"دجاجة\"}, {en:\"ten\", ar:\"عشرة\"}, {en:\"men\", ar:\"رجال\"}, {en:\"den\", ar:\"عرين\"}]},\n            {name:\"-et\", words:[{en:\"pet\", ar:\"حيوان أليف\"}, {en:\"net\", ar:\"شبكة\"}, {en:\"jet\", ar:\"طائرة نفاثة\"}, {en:\"wet\", ar:\"مبلل\"}, {en:\"set\", ar:\"مجموعة\"}, {en:\"vet\", ar:\"طبيب بيطري\"}, {en:\"get\", ar:\"يحصل على\"}, {en:\"let\", ar:\"يسمح\"}, {en:\"met\", ar:\"قابل\"}]},\n            {name:\"-ed\", words:[{en:\"bed\", ar:\"سرير\"}, {en:\"red\", ar:\"أحمر\"}, {en:\"fed\", ar:\"أطعم\"}, {en:\"led\", ar:\"قاد\"}, {en:\"wed\", ar:\"تزوج\"}]},\n            {name:\"-eg\", words:[{en:\"leg\", ar:\"ساق\"}, {en:\"peg\", ar:\"مشبك\"}, {en:\"keg\", ar:\"برميل\"}, {en:\"beg\", ar:\"يتوسل\"}, {en:\"egg\", ar:\"بيضة\"}]},\n            {name:\"-ell\", words:[{en:\"bell\", ar:\"جرس\"}, {en:\"tell\", ar:\"يخبر\"}, {en:\"sell\", ar:\"يبيع\"}, {en:\"well\", ar:\"بئر / جيد\"}, {en:\"yell\", ar:\"يصرخ\"}]},\n            {name:\"-em\", words:[{en:\"gem\", ar:\"جوهرة\"}, {en:\"hem\", ar:\"حافة القماش\"}, {en:\"stem\", ar:\"ساق النبات\"}]}\n        ],\n\n        // ===== VI. Short E words (4 letters) =====\n        fourWords: [\n            {en:\"best\", ar:\"الأفضل\"}, {en:\"rest\", ar:\"يستريح\"}, {en:\"nest\", ar:\"عش\"}, {en:\"test\", ar:\"اختبار\"},\n            {en:\"vest\", ar:\"سترة\"}, {en:\"desk\", ar:\"مكتب\"}, {en:\"mess\", ar:\"فوضى\"}, {en:\"fest\", ar:\"مهرجان\"},\n            {en:\"west\", ar:\"غرب\"}, {en:\"pest\", ar:\"حشرة ضارة\"}, {en:\"jest\", ar:\"دعابة\"}, {en:\"lend\", ar:\"يُعير\"},\n            {en:\"send\", ar:\"يرسل\"}, {en:\"bend\", ar:\"ينحني\"}, {en:\"rend\", ar:\"يمزق\"}, {en:\"text\", ar:\"نص\"},\n            {en:\"mend\", ar:\"يصلح\"}, {en:\"step\", ar:\"خطوة\"}, {en:\"fell\", ar:\"سقط\"}, {en:\"tend\", ar:\"يعتني\"},\n            {en:\"kept\", ar:\"احتفظ\"}, {en:\"left\", ar:\"يسار / غادر\"}, {en:\"felt\", ar:\"شعر\"}, {en:\"melt\", ar:\"يذوب\"},\n            {en:\"belt\", ar:\"حزام\"}, {en:\"help\", ar:\"يساعد\"}, {en:\"self\", ar:\"النفس\"}, {en:\"next\", ar:\"التالي\"},\n            {en:\"tent\", ar:\"خيمة\"}, {en:\"went\", ar:\"ذهب\"}, {en:\"cent\", ar:\"سنت\"}, {en:\"peck\", ar:\"ينقر\"},\n            {en:\"neck\", ar:\"رقبة\"}, {en:\"less\", ar:\"أقل\"}, {en:\"verb\", ar:\"فعل\"}, {en:\"herd\", ar:\"قطيع\"},\n            {en:\"fern\", ar:\"سرخس\"}, {en:\"jerk\", ar:\"يهز بعنف\"}, {en:\"perk\", ar:\"ميزة\"}, {en:\"term\", ar:\"مصطلح\"}\n        ],\n\n        // ===== أمثلة الجمل بعد كل قسم =====\n        examples: {\n        aWords: [\n            {en:\"I eat an egg.\", ar:\"أنا آكل بيضة.\", w:[\"eat\", \"egg\"]},\n            {en:\"The elephant has a big ear.\", ar:\"للفيل أذن كبيرة.\", w:[\"elephant\", \"ear\"]},\n            {en:\"The eagle has a sharp eye.\", ar:\"للنسر عين حادة.\", w:[\"eagle\", \"eye\"]},\n            {en:\"The exam is easy.\", ar:\"الامتحان سهل.\", w:[\"exam\", \"easy\"]},\n            {en:\"Please exit the elevator.\", ar:\"من فضلك اخرج من المصعد.\", w:[\"exit\", \"elevator\"]},\n            {en:\"I send an email to everyone.\", ar:\"أرسل بريدًا إلكترونيًا للجميع.\", w:[\"email\", \"everyone\"]},\n            {en:\"We enjoy the event.\", ar:\"نحن نستمتع بالحدث.\", w:[\"enjoy\", \"event\"]},\n            {en:\"I use an eraser.\", ar:\"أنا أستخدم ممحاة.\", w:[\"eraser\"]}\n        ],\n        families: [\n            {en:\"The hen has ten eggs.\", ar:\"الدجاجة لديها عشر بيضات.\", w:[\"hen\", \"ten\"]},\n            {en:\"The pet is wet.\", ar:\"الحيوان الأليف مبلل.\", w:[\"pet\", \"wet\"]},\n            {en:\"The red bed is big.\", ar:\"السرير الأحمر كبير.\", w:[\"red\", \"bed\"]},\n            {en:\"I hurt my leg.\", ar:\"آلمتُ ساقي.\", w:[\"leg\"]},\n            {en:\"I will sell the bell.\", ar:\"سأبيع الجرس.\", w:[\"sell\", \"bell\"]},\n            {en:\"The gem is red.\", ar:\"الجوهرة حمراء.\", w:[\"gem\"]}\n        ],\n        fourWords: [\n            {en:\"My desk is next to the bed.\", ar:\"مكتبي بجانب السرير.\", w:[\"desk\", \"next\"]},\n            {en:\"I send a text.\", ar:\"أرسل رسالة نصية.\", w:[\"send\", \"text\"]},\n            {en:\"I will rest in the tent.\", ar:\"سأستريح في الخيمة.\", w:[\"rest\", \"tent\"]},\n            {en:\"I help my friend.\", ar:\"أنا أساعد صديقي.\", w:[\"help\"]},\n            {en:\"The ice will melt.\", ar:\"الثلج سيذوب.\", w:[\"melt\"]},\n            {en:\"I went to the west.\", ar:\"ذهبت إلى الغرب.\", w:[\"went\", \"west\"]},\n            {en:\"The nest is in the tree.\", ar:\"العش على الشجرة.\", w:[\"nest\"]},\n            {en:\"The giraffe has a long neck.\", ar:\"الزرافة لديها رقبة طويلة.\", w:[\"neck\"]},\n            {en:\"I have a test next week.\", ar:\"لدي اختبار الأسبوع القادم.\", w:[\"test\", \"next\"]}\n        ]\n        },\n        // ===== VII. Reading sentences =====\n        story: [\n            [{en: \"The hen sat on the nest.\", ar: \"الدجاجة جلست على العش.\"}],\n            [{en: \"Ben has ten red pens.\", ar: \"بن لديه عشرة أقلام حمراء.\"}],\n            [{en: \"The pet is on the bed.\", ar: \"الحيوان الأليف على السرير.\"}],\n            [{en: \"Get the net, Meg!\", ar: \"هاتي الشبكة يا ميج!\"}],\n            [{en: \"The vet will help the pet.\", ar: \"الطبيب البيطري سيساعد الحيوان الأليف.\"}],\n            [{en: \"Ted went to the desk to rest.\", ar: \"تيد ذهب إلى المكتب ليستريح.\"}]\n        ]\n    };\n\n    // ============================================================\n    // ⚙️ Engine (same engine as the lesson template)\n    // ============================================================\n    const synth = window.speechSynthesis;\n    let availableVoices = [];\n    let voiceLoadAttempt = 0;\n    const MAX_VOICE_ATTEMPTS = 6;\n    const RETRY_DELAYS = [0, 150, 400, 800, 1500, 2500];\n\n    function loadAvailableVoices() {\n        const vList = synth.getVoices();\n        if (vList.length) {\n            availableVoices = vList;\n            voiceLoadAttempt = 0;\n            populateVoiceDropdown();\n            return;\n        }\n        if (voiceLoadAttempt < MAX_VOICE_ATTEMPTS) {\n            const delay = RETRY_DELAYS[voiceLoadAttempt] || 2500;\n            voiceLoadAttempt++;\n            setTimeout(loadAvailableVoices, delay);\n        }\n    }\n\n    function voiceQualityScore(v) {\n        const name = (v.name || '').toLowerCase();\n        let score = 0;\n        if (name.includes('google')) score += 30;\n        if (name.includes('microsoft')) score += 25;\n        if (name.includes('samantha')) score += 20;\n        if (v.localService) score += 2;\n        return score;\n    }\n\n    function populateVoiceDropdown() {\n        const vs = document.getElementById('voice-select');\n        if (!vs || !availableVoices.length) return;\n        const normLang = (l) => String(l||'').replace('_','-').toLowerCase();\n        const enVoices = availableVoices.filter(v => {\n            const lang = normLang(v.lang);\n            return lang.startsWith('en-us') || lang.startsWith('en-gb');\n        });\n        if (!enVoices.length) return;\n        enVoices.sort((a,b) => voiceQualityScore(b) - voiceQualityScore(a));\n        const savedLang = localStorage.getItem('lesson_voice') || 'en-US';\n        const savedVoiceURI = localStorage.getItem('lesson_voiceURI') || '';\n        vs.innerHTML = '';\n        enVoices.forEach(v => {\n            const lang = String(v.lang||'').replace('_','-');\n            const isUS = lang.toLowerCase().startsWith('en-us');\n            const flag = isUS ? '🇺🇸 American' : '🇬🇧 British';\n            const opt = document.createElement('option');\n            opt.value = v.voiceURI;\n            opt.dataset.lang = lang;\n            opt.textContent = flag + ' — ' + v.name;\n            vs.appendChild(opt);\n        });\n        const savedOpt = [...vs.options].find(o => o.value === savedVoiceURI) ||\n                         [...vs.options].find(o => o.dataset.lang.toLowerCase().startsWith(savedLang.toLowerCase()));\n        if (savedOpt) vs.value = savedOpt.value;\n    }\n\n    function getBestVoice() {\n        const vs = document.getElementById('voice-select');\n        if (!vs) return null;\n        const selectedURI = vs.value;\n        const found = availableVoices.find(v => v.voiceURI === selectedURI);\n        if (found) return found;\n        const targetLang = vs.options[vs.selectedIndex]?.dataset?.lang || vs.value || 'en-US';\n        const normTarget = targetLang.toLowerCase().replace('_','-');\n        const matches = availableVoices.filter(v => {\n            const vl = String(v.lang||'').replace('_','-').toLowerCase();\n            return vl === normTarget || vl.startsWith(normTarget + '-') || vl.startsWith(normTarget.split('-')[0] + '-' + normTarget.split('-')[1]);\n        });\n        if (matches.length) {\n            matches.sort((a,b) => voiceQualityScore(b) - voiceQualityScore(a));\n            return matches[0];\n        }\n        return null;\n    }\n\n    function getSelectedLang() {\n        const vs = document.getElementById('voice-select');\n        if (!vs) return 'en-US';\n        const opt = vs.options[vs.selectedIndex];\n        return (opt && opt.dataset && opt.dataset.lang) || vs.value || 'en-US';\n    }\n\n    loadAvailableVoices();\n    if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadAvailableVoices;\n\n    let speechQueue = [];\n    let isPlaying = false;\n    let currentSpeakingElement = null;\n\n    function loadPrefs() {\n        try {\n            const voice = localStorage.getItem('lesson_voice') || 'en-US';\n            const speed = localStorage.getItem('lesson_speed') || '0.9';\n            const theme = localStorage.getItem('lesson_theme') || 'green';\n            document.getElementById('voice-select').value = voice;\n            document.getElementById('speed-slider').value = speed;\n            document.getElementById('speed-value').innerText = speed + 'x';\n            applyTheme(theme);\n            document.querySelectorAll('.theme-dot').forEach(d => {\n                d.classList.toggle('active', d.dataset.theme === theme);\n            });\n        } catch(e) {}\n    }\n    function savePrefs() {\n        try {\n            localStorage.setItem('lesson_voice', getSelectedLang());\n            localStorage.setItem('lesson_voiceURI', document.getElementById('voice-select').value);\n            localStorage.setItem('lesson_speed', document.getElementById('speed-slider').value);\n            localStorage.setItem('lesson_theme', document.querySelector('.theme-dot.active')?.dataset?.theme || 'green');\n        } catch(e) {}\n    }\n\n    const themes = {\n        green:  { accent:'#2e7d32', highlight:'#c8e6c9', speak:'#1b5e20', play:'#4caf50', border:'#81c784' },\n        blue:   { accent:'#1565c0', highlight:'#bbdefb', speak:'#0d47a1', play:'#1e88e5', border:'#64b5f6' },\n        orange: { accent:'#ef6c00', highlight:'#ffe0b2', speak:'#e65100', play:'#fb8c00', border:'#ffb74d' },\n        pink:   { accent:'#d81b60', highlight:'#f8bbd0', speak:'#ad1457', play:'#ec407a', border:'#f48fb1' }\n    };\n    function applyTheme(t) {\n        const theme = themes[t];\n        if(!theme) return;\n        const root = document.documentElement.style;\n        root.setProperty('--accent-color', theme.accent);\n        root.setProperty('--highlight-color', theme.highlight);\n        root.setProperty('--speak-highlight', theme.speak);\n        root.setProperty('--play-all-btn', theme.play);\n        root.setProperty('--border-color', theme.border);\n    }\n\n    function cancelSpeech() {\n        synth.cancel();\n        isPlaying = false;\n        speechQueue = [];\n        if (currentSpeakingElement) {\n            currentSpeakingElement.classList.remove('speaking-highlight');\n            currentSpeakingElement = null;\n        }\n    }\n\n    function speakText(text, element) {\n        if (!text) return;\n        cancelSpeech();\n        const utter = new SpeechSynthesisUtterance(text);\n        utter.lang = getSelectedLang();\n        { const _v = getBestVoice(); if (_v) utter.voice = _v; }\n        utter.rate = parseFloat(document.getElementById('speed-slider').value);\n\n        if (element) {\n            element.classList.add('speaking-highlight');\n            currentSpeakingElement = element;\n            element.scrollIntoView({ behavior: 'smooth', block: 'center' });\n            utter.onend = () => {\n                if (currentSpeakingElement) {\n                    currentSpeakingElement.classList.remove('speaking-highlight');\n                    currentSpeakingElement = null;\n                }\n                isPlaying = false;\n            };\n            utter.onerror = () => {\n                if (currentSpeakingElement) {\n                    currentSpeakingElement.classList.remove('speaking-highlight');\n                    currentSpeakingElement = null;\n                }\n                isPlaying = false;\n            };\n        }\n        synth.speak(utter);\n        isPlaying = true;\n    }\n\n    function playQueue(elements) {\n        cancelSpeech();\n        if (!elements || elements.length === 0) return;\n        let index = 0;\n        speechQueue = [...elements];\n        isPlaying = true;\n\n        function next() {\n            if (!isPlaying || index >= speechQueue.length) {\n                isPlaying = false;\n                return;\n            }\n            const el = speechQueue[index];\n            const text = (el.dataset.say || el.innerText).trim();\n            if (!text) { index++; next(); return; }\n\n            const utter = new SpeechSynthesisUtterance(text);\n            utter.lang = getSelectedLang();\n            { const _v = getBestVoice(); if (_v) utter.voice = _v; }\n            utter.rate = parseFloat(document.getElementById('speed-slider').value);\n\n            el.classList.add('speaking-highlight');\n            currentSpeakingElement = el;\n            el.scrollIntoView({ behavior: 'smooth', block: 'center' });\n\n            utter.onend = () => {\n                if (currentSpeakingElement) {\n                    currentSpeakingElement.classList.remove('speaking-highlight');\n                    currentSpeakingElement = null;\n                }\n                index++;\n                if (isPlaying) next();\n                else isPlaying = false;\n            };\n            utter.onerror = () => {\n                if (currentSpeakingElement) {\n                    currentSpeakingElement.classList.remove('speaking-highlight');\n                    currentSpeakingElement = null;\n                }\n                index++;\n                if (isPlaying) next();\n                else isPlaying = false;\n            };\n            synth.speak(utter);\n        }\n        next();\n    }\n\n    // ---------- helpers for this lesson ----------\n    // يلوّن أول حرف e في الكلمة بالأحمر (زي الشارتات)\n    function markA(text) {\n        const i = text.toLowerCase().indexOf('e');\n        if (i < 0) return text;\n        return text.slice(0, i) + '<span class=\"va\">' + text[i] + '<\/span>' + text.slice(i + 1);\n    }\n\n    function makeSpeakSpan(text, mark) {\n        const span = document.createElement('span');\n        span.className = 'vocab-element';\n        if (mark) span.innerHTML = markA(text); else span.innerText = text;\n        const say = lessonData.say[text];\n        if (say) span.dataset.say = say;\n        span.onclick = () => speakText(say || text, span);\n        return span;\n    }\n\n    function fillPairs(tbody, data, mark, collector) {\n        tbody.innerHTML = '';\n        for (let i = 0; i < data.length; i += 2) {\n            const tr = document.createElement('tr');\n            [i, i + 1].forEach(idx => {\n                if (data[idx]) {\n                    const tdEn = document.createElement('td');\n                    tdEn.className = 'english-cell';\n                    const span = makeSpeakSpan(data[idx].en, mark);\n                    tdEn.appendChild(span);\n                    const tdAr = document.createElement('td');\n                    tdAr.className = 'arabic-cell';\n                    tdAr.innerText = data[idx].ar;\n                    tr.append(tdEn, tdAr);\n                    collector.push(span);\n                }\n            });\n            tbody.appendChild(tr);\n        }\n    }\n\n    function fillChips(gridId, items, collector) {\n        const grid = document.getElementById(gridId);\n        grid.innerHTML = '';\n        items.forEach(t => {\n            const span = makeSpeakSpan(t, true);\n            grid.appendChild(span);\n            collector.push(span);\n        });\n    }\n\n    function initLesson() {\n        const meta = lessonData.meta;\n        document.getElementById('main-title').innerText = meta.mainTitle;\n        document.getElementById('sub-title').innerText = meta.subTitle;\n        document.getElementById('play-all-sounds-btn').innerText = meta.playAllSounds;\n        document.getElementById('play-all-words-btn').innerText = meta.playAllWords;\n        document.getElementById('play-all-story-btn').innerText = meta.playAllStory;\n\n        const soundEls = [];\n        const wordEls = [];\n\n        // I. intro sentences\n        const introTbody = document.querySelector('#intro tbody');\n        introTbody.innerHTML = '';\n        lessonData.intro.forEach(k => {\n            const tr = document.createElement('tr');\n            const tdEn = document.createElement('td');\n            tdEn.className = 'english-cell';\n            const span = makeSpeakSpan(k.en, false);\n            tdEn.appendChild(span);\n            const tdAr = document.createElement('td');\n            tdAr.className = 'arabic-cell';\n            tdAr.innerText = k.ar;\n            tr.append(tdEn, tdAr);\n            introTbody.appendChild(tr);\n            soundEls.push(span);\n        });\n\n        // II + III. blends\n        fillChips('blends-grid', lessonData.blends, soundEls);\n        fillChips('cons-grid', lessonData.consA, soundEls);\n\n        // IV. A words\n        fillPairs(document.querySelector('#a-words tbody'), lessonData.aWords, true, wordEls);\n\n        // V. families\n        const famBox = document.getElementById('families');\n        famBox.innerHTML = '';\n        lessonData.families.forEach(f => {\n            const block = document.createElement('div');\n            block.className = 'family-block';\n            const title = document.createElement('div');\n            title.className = 'family-title';\n            title.innerText = 'Family ' + f.name;\n            const wrap = document.createElement('div');\n            wrap.className = 'table-wrap';\n            const table = document.createElement('table');\n            const tbody = document.createElement('tbody');\n            table.appendChild(tbody);\n            wrap.appendChild(table);\n            block.append(title, wrap);\n            famBox.appendChild(block);\n            fillPairs(tbody, f.words, true, wordEls);\n        });\n\n        // VI. 4-letter words\n        fillPairs(document.querySelector('#four-words tbody'), lessonData.fourWords, true, wordEls);\n\n        // VII. reading\n        const sBox = document.getElementById('story-container');\n        sBox.innerHTML = '';\n        const storySentences = [];\n        lessonData.story.forEach(paragraph => {\n            const partDiv = document.createElement('div');\n            partDiv.className = 'reading-paragraph';\n            paragraph.forEach(sentence => {\n                const line = document.createElement('div');\n                const sentSpan = document.createElement('span');\n                sentSpan.className = 'english-sentence';\n                sentSpan.innerText = sentence.en;\n                sentSpan.onclick = () => speakText(sentence.en, sentSpan);\n\n                const arSpan = document.createElement('span');\n                arSpan.className = 'arabic-translation';\n                arSpan.innerText = sentence.ar;\n\n                line.appendChild(sentSpan);\n                line.appendChild(arSpan);\n                partDiv.appendChild(line);\n                storySentences.push(sentSpan);\n            });\n            sBox.appendChild(partDiv);\n        });\n\n                // ---------- جمل أمثلة بعد كل قسم ----------\n        function markWords(text, words) {\n            let out = text;\n            words.forEach(w => {\n                out = out.replace(new RegExp('\\\\b(' + w + ')(s)?\\\\b', 'gi'), '<span class=\"va\">$1$2<\/span>');\n            });\n            return out;\n        }\n        function buildExamples(boxId, list) {\n            const box = document.getElementById(boxId);\n            box.innerHTML = '';\n            const title = document.createElement('div');\n            title.className = 'ex-title';\n            title.innerText = '✏️ Example Sentences (جمل أمثلة)';\n            box.appendChild(title);\n            const spans = [];\n            const btn = document.createElement('button');\n            btn.className = 'play-btn';\n            btn.innerText = '▶️ نطق جمل الأمثلة';\n            box.appendChild(btn);\n            list.forEach(item => {\n                const p = document.createElement('div');\n                p.className = 'reading-paragraph';\n                const s = document.createElement('span');\n                s.className = 'english-sentence';\n                s.innerHTML = markWords(item.en, item.w);\n                s.onclick = () => speakText(item.en, s);\n                const a = document.createElement('span');\n                a.className = 'arabic-translation';\n                a.innerText = item.ar;\n                p.append(s, a);\n                box.appendChild(p);\n                spans.push(s);\n            });\n            btn.onclick = () => playQueue(spans);\n        }\n        buildExamples('ex-a', lessonData.examples.aWords);\n        buildExamples('ex-fam', lessonData.examples.families);\n        buildExamples('ex-four', lessonData.examples.fourWords);\n\n        document.getElementById('play-all-sounds-btn').onclick = () => playQueue(soundEls);\n        document.getElementById('play-all-words-btn').onclick = () => playQueue(wordEls);\n        document.getElementById('play-all-story-btn').onclick = () => playQueue(storySentences);\n        document.getElementById('stop-btn').onclick = cancelSpeech;\n\n        buildQuiz();\n        document.getElementById('quiz-reset-btn').onclick = buildQuiz;\n\n        document.getElementById('voice-select').onchange = savePrefs;\n        document.getElementById('speed-slider').oninput = () => {\n            document.getElementById('speed-value').innerText = document.getElementById('speed-slider').value + 'x';\n            savePrefs();\n        };\n        document.querySelectorAll('.theme-dot').forEach(dot => {\n            dot.onclick = () => {\n                document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));\n                dot.classList.add('active');\n                applyTheme(dot.dataset.theme);\n                savePrefs();\n            };\n        });\n    }\n\n    // ---------- Quiz ----------\n    let quizPool = [], quizItems = [], quizIndex = 0, quizScore = 0;\n\n    function shuffle(arr) {\n        for (let i = arr.length - 1; i > 0; i--) {\n            const j = Math.floor(Math.random() * (i + 1));\n            [arr[i], arr[j]] = [arr[j], arr[i]];\n        }\n        return arr;\n    }\n\n    function fireConfetti(container) {\n        const colors = ['#e53935', '#fb8c00', '#fdd835', '#43a047', '#1e88e5', '#8e24aa'];\n        for (let i = 0; i < 28; i++) {\n            const conf = document.createElement('div');\n            conf.className = 'confetti-piece';\n            conf.style.left = (35 + Math.random() * 30) + '%';\n            conf.style.background = colors[Math.floor(Math.random() * colors.length)];\n            conf.style.animationDelay = (Math.random() * 0.25) + 's';\n            conf.style.setProperty('--x', (Math.random() * 220 - 110) + 'px');\n            container.appendChild(conf);\n            setTimeout(() => conf.remove(), 1400);\n        }\n    }\n\n    function buildQuiz() {\n        const famWords = lessonData.families.flatMap(f => f.words);\n        const allVocab = [...lessonData.aWords, ...famWords, ...lessonData.fourWords];\n        const uniq = []; const seenEn = new Set();\n        allVocab.forEach(w => { if (!seenEn.has(w.en)) { seenEn.add(w.en); uniq.push(w); } });\n        quizPool = shuffle(uniq);\n        quizItems = quizPool.slice(0, Math.min(10, quizPool.length));\n        quizIndex = 0; quizScore = 0;\n        document.getElementById('quiz-score').innerText = '';\n        document.getElementById('quiz-reset-btn').style.display = 'none';\n        showQuizQuestion();\n    }\n\n    function showQuizQuestion() {\n        const quizBox = document.getElementById('quiz-container');\n        const progress = document.getElementById('quiz-progress');\n        const feedback = document.getElementById('quiz-feedback');\n        const scoreDiv = document.getElementById('quiz-score');\n        feedback.innerText = ''; feedback.className = 'quiz-feedback';\n        quizBox.innerHTML = '';\n\n        if (quizIndex >= quizItems.length) {\n            progress.innerText = '';\n            scoreDiv.innerText = `🏆 انتهى الاختبار! نتيجتك: ${quizScore} / ${quizItems.length}`;\n            document.getElementById('quiz-reset-btn').style.display = 'inline-block';\n            return;\n        }\n\n        progress.innerText = `سؤال ${quizIndex + 1} من ${quizItems.length}`;\n        const item = quizItems[quizIndex];\n\n        // اختيارات خاطئة بمعاني مختلفة وغير مكررة\n        const seen = new Set([item.ar]);\n        const distractors = [];\n        for (const p of shuffle([...quizPool])) {\n            if (!seen.has(p.ar)) { seen.add(p.ar); distractors.push(p.ar); }\n            if (distractors.length === 3) break;\n        }\n        const options = shuffle([item.ar, ...distractors]);\n\n        const qDiv = document.createElement('div'); qDiv.className = 'quiz-question'; qDiv.style.position = 'relative';\n        qDiv.innerHTML = `<p class=\"q-text\">ما معنى كلمة \"<span style=\"color:var(--accent-color)\">${item.en}<\/span>\"؟<\/p>`;\n        const optWrap = document.createElement('div'); optWrap.className = 'quiz-options';\n        let locked = false;\n\n        options.forEach(opt => {\n            const optBtn = document.createElement('div');\n            optBtn.className = 'quiz-option';\n            optBtn.innerText = opt;\n            optBtn.onclick = () => {\n                if (locked) return;\n                locked = true;\n                document.querySelectorAll('.quiz-option').forEach(b => b.style.pointerEvents = 'none');\n\n                if (opt === item.ar) {\n                    optBtn.classList.add('correct');\n                    feedback.innerText = '🎉 إجابة صحيحة!'; feedback.className = 'quiz-feedback correct';\n                    fireConfetti(qDiv);\n                    speakText('Correct!');\n                    quizScore++;\n                    setTimeout(() => { quizIndex++; showQuizQuestion(); }, 1200);\n                } else {\n                    optBtn.classList.add('wrong');\n                    document.querySelectorAll('.quiz-option').forEach(b => {\n                        if (b.innerText === item.ar) b.classList.add('show-correct');\n                    });\n                    feedback.innerText = `❌ خطأ! الإجابة الصحيحة: \"${item.ar}\"`;\n                    feedback.className = 'quiz-feedback wrong';\n                    speakText('Wrong!');\n                    setTimeout(() => { quizIndex++; showQuizQuestion(); }, 2000);\n                }\n            };\n            optWrap.appendChild(optBtn);\n        });\n        qDiv.appendChild(optWrap);\n        quizBox.appendChild(qDiv);\n    }\n\n    window.onload = () => {\n        loadPrefs();\n        initLesson();\n    };\n<\/script>\n<\/body>\n<\/html>\n", "I": "<!DOCTYPE html>\n<html lang=\"ar\" dir=\"ltr\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Level 1 - Short Vowels: Short I<\/title>\n    <link href=\"https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Roboto:wght@400;700&display=swap\" rel=\"stylesheet\">\n    <style>\n        :root {\n            --bg-color: #f0f4f8; --card-color: #ffffff; --accent-color: #2e7d32;\n            --text-color: #212121; --highlight-color: #c8e6c9; --speak-highlight: #1b5e20;\n            --play-all-btn: #4caf50; --secondary-text-color: #424242; --border-color: #81c784;\n            --speech-glow: #ffeb3b;\n        }\n        * { box-sizing: border-box; }\n        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; text-align: center; color: var(--text-color); transition: background-color 0.3s; }\n        .container { max-width: 10
